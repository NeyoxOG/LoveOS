<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FillBox</title>
    <style>
        body { margin:0; background:#111; color:#fff; font-family:-apple-system; height:100vh; overflow:hidden; user-select:none; touch-action:none; display:flex; flex-direction:column; align-items:center; }
        
        .header { width:100%; padding:20px; display:flex; justify-content:space-between; font-weight:bold; font-size:18px; }
        
        .grid-container {
            width:300px; height:300px; background:#222; border:2px dashed #444; border-radius:12px;
            display:grid; grid-template-columns:repeat(6, 1fr); grid-template-rows:repeat(6, 1fr);
            position:relative;
        }
        .cell { border:1px solid rgba(255,255,255,0.05); }
        .cell.filled { background:#ec4899; box-shadow:inset 0 0 5px rgba(0,0,0,0.3); border-radius:4px; }

        .dock {
            margin-top:auto; width:100%; height:120px; background:#1c1c1e;
            display:flex; align-items:center; justify-content:center; gap:20px;
            border-top:1px solid #333;
        }
        
        .item {
            width:50px; height:50px; background:#4f46e5; border-radius:8px; cursor:grab;
            display:flex; align-items:center; justify-content:center; font-size:24px;
            box-shadow:0 4px 10px rgba(0,0,0,0.3);
            touch-action:none;
        }
        .item.shape-L { background:#f59e0b; } /* 3 cells L */
        .item.shape-I { background:#06b6d4; } /* 3 cells Line */
        .item.shape-O { background:#8b5cf6; } /* 2x2 */

        /* Dragging proxy */
        .draggable { position:fixed; pointer-events:none; z-index:1000; opacity:0.8; transform:scale(1.1); }

        .overlay { position:absolute; inset:0; background:rgba(0,0,0,0.9); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; display:none; }
        .overlay.active { display:flex; }
        button { margin-top:20px; padding:12px 30px; border-radius:20px; border:none; background:#ec4899; color:white; font-weight:700; cursor:pointer; }
        
        .btn-close { position:absolute; top:16px; left:16px; background:rgba(255,255,255,0.1); width:40px; height:40px; border-radius:50%; border:none; color:white; font-size:20px; cursor:pointer; z-index:30; }

    </style>
</head>
<body>
    <button class="btn-close" onclick="window.history.back()">✕</button>

    <div class="header">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="timer">60</span></div>
    </div>

    <div class="grid-container" id="grid">
        <!-- 36 cells generated -->
    </div>

    <div class="dock" id="dock">
        <!-- Spawn items here -->
    </div>

    <div class="overlay" id="startScreen" style="display:flex">
        <h1>Packer</h1>
        <p>Drag shapes into the box!</p>
        <button onclick="startGame()">Start</button>
    </div>

    <div class="overlay" id="endScreen">
        <h1>Finished!</h1>
        <p>Score: <span id="finalScore">0</span></p>
        <button onclick="startGame()">Play Again</button>
        <button style="background:transparent; border:1px solid #555" onclick="window.history.back()">Exit</button>
    </div>

    <script src="game_fillbox.js"></script>
</body>
</html>
