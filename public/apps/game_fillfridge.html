<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fill The Fridge</title>
  <style>
    body{margin:0;font-family:-apple-system;background:linear-gradient(160deg,#0f172a,#1e3a8a);color:#fff;height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
    .header{width:100%;padding:18px;display:flex;justify-content:space-between;font-weight:700}
    #fridge{width:min(88vw,360px);height:min(72vw,300px);display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:rgba(255,255,255,.1);padding:10px;border-radius:16px;border:1px solid rgba(255,255,255,.2)}
    .slot{background:rgba(255,255,255,.12);border-radius:8px;border:1px dashed rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px}
    .slot.filled{background:rgba(34,197,94,.25);border-style:solid}
    .dock{margin-top:auto;width:100%;padding:14px;display:flex;gap:10px;justify-content:center;background:rgba(0,0,0,.25)}
    .food{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:26px}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;flex-direction:column}
    .overlay.active{display:flex}
    button{padding:10px 18px;border-radius:999px;border:none;font-weight:700}
  </style>
</head>
<body>
  <div class="header"><div>Punkte: <span id="score">0</span></div><div>Level: <span id="level">1</span></div></div>
  <div id="fridge"></div>
  <div class="dock" id="dock"></div>

  <div class="overlay" id="start"><h1>Fill The Fridge</h1><p>Packe so effizient wie möglich.</p><button onclick="startGame()">Start</button></div>
  <div class="overlay" id="end"><h1>Runde vorbei</h1><p>Score: <span id="final">0</span></p><button onclick="startGame()">Nochmal</button></div>

  <script src="game_fillfridge.js"></script>
  <script>window.addEventListener('keydown',e=>{if(e.key==='Escape')history.back()})</script>
</body>
</html>
