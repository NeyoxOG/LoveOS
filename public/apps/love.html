<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love</title>
    <style>
        :root {
            --bg-dark: #000;
            --bg-card: #1c1c1e;
            --primary: #f43f5e; /* Rose */
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Top Bar */
        .topbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }
        .title { font-size: 17px; font-weight: 600; text-align: center; }

        /* Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Main Counter Card */
        .counter-card {
            background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center;
            position: relative; overflow: hidden;
        }
        .counter-card::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 50% -20%, rgba(244, 63, 94, 0.15), transparent 70%);
        }

        .heart-icon { font-size: 40px; margin-bottom: 10px; animation: heartbeat 2s infinite ease-in-out; }
        @keyframes heartbeat { 0%,100% {transform:scale(1);} 50% {transform:scale(1.1);} }

        .since-label { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .date-label { font-size: 15px; color: #fff; font-weight: 500; margin-bottom: 20px; }

        .big-count { font-size: 56px; font-weight: 800; line-height: 1; background: linear-gradient(to bottom right, #fff, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .big-unit { font-size: 16px; color: var(--text-dim); font-weight: 600; margin-top: 4px; }

        /* Grid Stats */
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .stat-card {
            background: var(--bg-card); border-radius: 16px; padding: 16px;
            text-align: center; border: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .stat-val { font-size: 20px; font-weight: 700; color: #fff; }
        .stat-lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }

        /* Countdown Card */
        .countdown-card {
            background: var(--bg-card); border-radius: 20px; padding: 20px;
            border: 1px solid var(--border); text-align: center;
        }
        .cd-header { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; }
        
        .cd-timer { display: flex; justify-content: center; gap: 16px; }
        .cd-part { display: flex; flex-direction: column; align-items: center; width: 40px; }
        .cd-num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .cd-txt { font-size: 9px; color: var(--text-dim); margin-top: 2px; }

        /* Badges Row */
        .badges-row {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;
        }
        .badge {
            background: rgba(255,255,255,0.05); border-radius: 20px; padding: 6px 12px;
            font-size: 12px; color: var(--text-dim); white-space: nowrap; border: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; gap: 6px;
        }
        .badge.active { background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.3); color: #f43f5e; }

        /* Modal Overlay */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            z-index: 100; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.4s;
        }
        .modal.active { display: flex; opacity: 1; }
        
        .modal-card {
            background: #1c1c1e; border-radius: 30px; padding: 30px; text-align: center;
            width: 85%; max-width: 300px; border: 1px solid rgba(255,255,255,0.1);
            transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal.active .modal-card { transform: scale(1); }
        
        .m-icon { font-size: 60px; margin-bottom: 20px; display: block; animation: bounce 1s infinite; }
        .m-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; color: #fff; }
        .m-text { font-size: 15px; color: var(--text-dim); margin-bottom: 24px; line-height: 1.4; }
        
        .m-btn {
            background: var(--primary); color: #fff; border: none; padding: 12px 24px;
            border-radius: 20px; font-weight: 600; cursor: pointer; width: 100%; font-size: 15px;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .hidden { display: none; }

    </style>
</head>
<body>

    <div class="topbar">
        <div class="title">Love 💞</div>
    </div>

    <div class="content">
        
        <div class="counter-card">
            <div class="heart-icon">💞</div>
            <div class="since-label">Zusammen seit</div>
            <div class="date-label">18. Mai 2025</div>
            
            <div class="big-count" id="countDays">0</div>
            <div class="big-unit">Tage</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-val" id="statWeeks">0</span>
                <span class="stat-lbl">Wochen</span>
            </div>
            <div class="stat-card">
                <span class="stat-val" id="statMonths">0</span>
                <span class="stat-lbl">Monate</span>
            </div>
            <div class="stat-card hidden" id="cardYears">
                <span class="stat-val" id="statYears">0</span>
                <span class="stat-lbl">Jahre</span>
            </div>
        </div>

        <div class="countdown-card">
            <div class="cd-header">Nächstes Monats-Jubiläum in</div>
            <div class="cd-timer">
                <div class="cd-part"><span class="cd-num" id="cdD">00</span><span class="cd-txt">Tage</span></div>
                <div class="cd-part"><span class="cd-num" id="cdH">00</span><span class="cd-txt">Std</span></div>
                <div class="cd-part"><span class="cd-num" id="cdM">00</span><span class="cd-txt">Min</span></div>
                <div class="cd-part"><span class="cd-num" id="cdS">00</span><span class="cd-txt">Sek</span></div>
            </div>
        </div>

        <div class="badges-row" id="badgesContainer">
            <div class="badge active">Start 🚀</div>
            <!-- Populated by JS -->
        </div>

    </div>

    <!-- Milestone Modal -->
    <div class="modal" id="milestoneModal">
        <div class="modal-card">
            <div class="m-icon">🎉</div>
            <div class="m-title" id="mTitle">Jubiläum!</div>
            <div class="m-text" id="mText">...</div>
            <button class="m-btn" onclick="closeModal()">Wundervoll 💞</button>
        </div>
    </div>

    <script src="love.js"></script>
</body>
</html>
