
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belohnungen</title>
    <style>
        :root {
            --bg-dark: #000;
            --bg-card: #1c1c1e;
            --primary: #f59e0b; /* Gold/Amber */
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Top Bar */
        .topbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }
        .title { font-size: 17px; font-weight: 600; text-align: center; }

        /* Controls */
        .tabs-container {
            padding: 12px 16px;
            background: rgba(28, 28, 30, 0.5);
        }
        .segmented-control {
            background: rgba(118, 118, 128, 0.24);
            border-radius: 9px;
            padding: 2px;
            display: flex;
            position: relative;
        }
        .segment-btn {
            flex: 1; padding: 6px 0; text-align: center; font-size: 13px; font-weight: 500; color: #fff; z-index: 2; cursor: pointer;
        }
        .segment-indicator {
            position: absolute; top: 2px; bottom: 2px; width: 50%; background: #636366; border-radius: 7px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1;
        }

        /* Main Content */
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Card Style */
        .reward-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid var(--border);
            transition: transform 0.2s, background 0.2s;
            position: relative;
            overflow: hidden;
        }
        .reward-card:active { transform: scale(0.98); background: rgba(255,255,255,0.1); }
        
        .card-icon {
            width: 48px; height: 48px; border-radius: 12px;
            background: rgba(255,255,255,0.05);
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; flex-shrink: 0;
        }
        .card-info { flex: 1; min-width: 0; }
        .card-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { font-size: 10px; color: var(--primary); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }

        /* Action Button */
        .redeem-btn {
            background: var(--primary); color: #000; border: none;
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700;
            cursor: pointer; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
            transition: transform 0.2s;
        }
        .redeem-btn:active { transform: scale(0.9); }
        
        .redeemed-badge {
            color: #4ade80; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px;
        }

        /* Confetti Overlay */
        .confetti-container {
            position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden;
        }
        .confetti {
            position: absolute; width: 8px; height: 8px; background: #f00;
            animation: fall 3s linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .empty-state {
            text-align: center; color: var(--text-dim); margin-top: 60px;
            font-size: 14px;
        }

        .category-header {
            font-size: 13px; color: var(--text-dim); text-transform: uppercase;
            margin-top: 10px; margin-bottom: 4px; padding-left: 4px; letter-spacing: 0.5px;
        }

    </style>
</head>
<body>

    <div class="topbar">
        <div class="title">Belohnungen 🎁</div>
    </div>

    <div class="tabs-container">
        <div class="segmented-control">
            <div class="segment-indicator" id="segIndicator"></div>
            <div class="segment-btn" onclick="filterList('active', 0)">Verfügbar</div>
            <div class="segment-btn" onclick="filterList('redeemed', 1)">Eingelöst</div>
        </div>
    </div>

    <div class="list-container" id="list">
        <!-- JS populates -->
        <div class="empty-state">Lade Belohnungen...</div>
    </div>

    <div class="confetti-container" id="confetti"></div>

    <script src="rewards.js"></script>
</body>
</html>
