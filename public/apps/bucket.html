
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ziele</title>
    <style>
        :root {
            --bg-dark: #000;
            --bg-card: #1c1c1e;
            --primary: #f43f5e; /* Rose/Pink */
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Top Bar */
        .topbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }
        .title { font-size: 17px; font-weight: 600; }
        
        .add-btn {
            background: none; border: none; color: var(--primary);
            font-size: 28px; cursor: pointer; line-height: 1; padding: 0 10px;
        }

        /* Filter Tabs */
        .tabs-scroll {
            display: flex; gap: 10px; padding: 12px 20px;
            overflow-x: auto; background: rgba(28,28,30,0.5);
            scrollbar-width: none;
        }
        .tab-chip {
            background: rgba(255,255,255,0.1); padding: 6px 14px;
            border-radius: 20px; font-size: 13px; font-weight: 600;
            white-space: nowrap; cursor: pointer; border: 1px solid transparent;
            transition: all 0.2s;
        }
        .tab-chip.active {
            background: var(--primary); color: #000;
        }

        /* List */
        .list-content {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
            padding-bottom: 80px;
        }

        .item-card {
            background: var(--bg-card); border-radius: 16px; padding: 16px;
            display: flex; align-items: flex-start; gap: 14px;
            border: 1px solid var(--border); transition: transform 0.2s;
        }
        .item-card:active { transform: scale(0.98); }
        
        .checkbox {
            width: 24px; height: 24px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; flex-shrink: 0; margin-top: 2px;
            transition: background 0.2s, border 0.2s;
        }
        .checkbox.checked {
            background: #34c759; border-color: #34c759;
        }
        .checkbox-icon { font-size: 14px; color: #000; display: none; }
        .checkbox.checked .checkbox-icon { display: block; }

        .item-info { flex: 1; }
        .item-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; line-height: 1.3; }
        .item-title.done { text-decoration: line-through; opacity: 0.5; }
        .item-meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 8px; align-items: center; }
        .category-badge { text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }

        /* Progress Bar */
        .progress-container {
            padding: 20px; background: #1c1c1e; border-top: 1px solid var(--border);
        }
        .progress-label {
            display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; font-weight: 600;
        }
        .progress-track {
            height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f43f5e, #ec4899); width: 0%; transition: width 0.5s ease;
        }

        /* Modal */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 100; display: none; align-items: flex-end; /* Sheet style */
        }
        .modal.active { display: flex; }
        
        .sheet {
            background: #1c1c1e; width: 100%; border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 24px; animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            border-top: 1px solid var(--border);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-title { font-size: 18px; font-weight: 700; }
        .btn-close { background: none; border: none; color: var(--primary); font-size: 16px; font-weight: 600; cursor: pointer; }

        .input-group { margin-bottom: 16px; }
        .input-label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
        .input-text { 
            width: 100%; background: #2c2c2e; border: none; padding: 14px; 
            border-radius: 12px; color: #fff; font-size: 16px; 
        }
        .category-select {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
        }
        .cat-opt {
            background: #2c2c2e; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid transparent;
        }
        .cat-opt.selected { background: var(--primary); color: #000; font-weight: 600; }

        .btn-save {
            width: 100%; background: var(--primary); color: #000; border: none; padding: 16px;
            border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px;
        }

        .empty-state { text-align: center; color: var(--text-dim); margin-top: 60px; font-size: 14px; }

    </style>
</head>
<body>

    <div class="topbar">
        <div class="title">Unsere Ziele 📍</div>
        <button class="add-btn" onclick="openModal()">+</button>
    </div>

    <div class="tabs-scroll">
        <div class="tab-chip active" onclick="filter('all')">Alle</div>
        <div class="tab-chip" onclick="filter('travel')">Reisen ✈️</div>
        <div class="tab-chip" onclick="filter('dates')">Dates 🍷</div>
        <div class="tab-chip" onclick="filter('life')">Leben 🏠</div>
        <div class="tab-chip" onclick="filter('fun')">Fun 🤪</div>
    </div>

    <div class="list-content" id="list">
        <!-- Generated -->
    </div>

    <div class="progress-container">
        <div class="progress-label">
            <span>Fortschritt</span>
            <span id="progText">0/0</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progBar"></div>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal" id="modal">
        <div class="sheet">
            <div class="sheet-header">
                <span class="sheet-title">Neues Ziel</span>
                <button class="btn-close" onclick="closeModal()">Abbrechen</button>
            </div>
            
            <div class="input-group">
                <label class="input-label">Was wollen wir tun?</label>
                <input type="text" class="input-text" id="inpTitle" placeholder="z.B. Paris besuchen...">
            </div>

            <div class="input-group">
                <label class="input-label">Kategorie</label>
                <div class="category-select" id="catSelect">
                    <div class="cat-opt selected" onclick="selectCat('travel')">Reisen ✈️</div>
                    <div class="cat-opt" onclick="selectCat('dates')">Dates 🍷</div>
                    <div class="cat-opt" onclick="selectCat('life')">Leben 🏠</div>
                    <div class="cat-opt" onclick="selectCat('fun')">Fun 🤪</div>
                </div>
            </div>

            <button class="btn-save" onclick="addItem()">Hinzufügen</button>
        </div>
    </div>

    <script src="bucket.js"></script>
</body>
</html>
