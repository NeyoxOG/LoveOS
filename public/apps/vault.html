
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Message Vault</title>
    <style>
        :root {
            --bg-dark: #000;
            --bg-card: #1c1c1e;
            --primary: #ec4899; /* Pink */
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.15);
            --paper: #fdf2f8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Top Bar */
        .topbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }
        .title { font-size: 17px; font-weight: 600; text-align: center; flex: 1; }
        .action-btn { 
            color: var(--primary); font-size: 28px; font-weight: 300; cursor: pointer; border: none; background: none; padding: 0;
            transition: opacity 0.2s; width: 40px; display: flex; justify-content: flex-end;
        }
        .action-btn:active { opacity: 0.6; }
        .back-placeholder { width: 40px; } 

        /* Tabs */
        .tabs-container {
            padding: 12px 16px;
            background: rgba(28, 28, 30, 0.5);
            backdrop-filter: blur(10px);
        }
        .segmented-control {
            background: rgba(118, 118, 128, 0.24);
            border-radius: 9px;
            padding: 2px;
            display: flex;
            position: relative;
        }
        .segment-btn {
            flex: 1; padding: 6px 0; text-align: center; font-size: 13px; font-weight: 500; color: #fff; z-index: 2; cursor: pointer;
        }
        .segment-indicator {
            position: absolute; top: 2px; bottom: 2px; width: 25%; background: #636366; border-radius: 7px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1;
        }

        /* Main Content */
        .main-scroll {
            flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* Message Card */
        .msg-card {
            background: #2c2c2e; border-radius: 16px; position: relative; height: 160px;
            overflow: hidden; cursor: pointer; border: 1px solid var(--border);
            transition: transform 0.2s; perspective: 1000px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .msg-card:active { transform: scale(0.98); }

        /* Locked / Envelope Look */
        .envelope-layer {
            position: absolute; inset: 0; background: linear-gradient(145deg, #27272a, #18181b);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
            transition: transform 0.5s;
        }
        .envelope-flap-top {
            position: absolute; top: 0; left: 0; right: 0; height: 80px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent);
            clip-path: polygon(0 0, 100% 0, 50% 100%); z-index: 12;
        }
        
        .seal {
            width: 48px; height: 48px; border-radius: 50%; background: var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center;
            font-size: 20px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 15;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .card-content {
            position: absolute; inset: 0; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
            z-index: 5; background: #1c1c1e;
        }
        
        .msg-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .msg-preview { font-size: 13px; color: var(--text-dim); line-height: 1.4; opacity: 0.7; }
        .msg-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; margin-top: auto;}
        .author-info { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
        .author-avatar { width: 20px; height: 20px; border-radius: 50%; background: #444; display: flex; justify-content: center; align-items: center; font-size: 10px; }
        
        .status-badge { font-size: 10px; text-transform: uppercase; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.1); }
        
        /* Opened State */
        .msg-card.opened { background: #fce7f3; border-color: #fbcfe8; }
        .msg-card.opened .envelope-layer, .msg-card.opened .seal, .msg-card.opened .envelope-flap-top { display: none; }
        .msg-card.opened .card-content { background: transparent; }
        .msg-card.opened .msg-title { color: #831843; }
        .msg-card.opened .msg-preview { color: #9d174d; }
        .msg-card.opened .author-info { color: #be185d; }
        .msg-card.opened .status-badge { background: rgba(190, 24, 93, 0.1); color: #be185d; }

        /* Fullscreen Reader */
        .reader-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .reader-overlay.active { opacity: 1; pointer-events: auto; }
        
        .paper-sheet {
            width: 100%; max-width: 500px; height: 80vh; background: #fff1f2;
            border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            padding: 40px; display: flex; flex-direction: column;
            transform: translateY(50px) scale(0.95); transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .reader-overlay.active .paper-sheet { transform: translateY(0) scale(1); }
        
        .paper-texture { position: absolute; inset: 0; opacity: 0.4; background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%239C92AC' fill-opacity='0.1'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z'/%3E%3C/g%3E%3C/svg%3E"); pointer-events: none; }

        .paper-close {
            position: absolute; top: 15px; right: 15px; width: 32px; height: 32px;
            background: rgba(0,0,0,0.05); border-radius: 50%; color: #881337;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            z-index: 20; font-size: 18px; transition: background 0.2s;
        }
        .paper-close:active { background: rgba(0,0,0,0.1); }

        .paper-edit {
            position: absolute; top: 15px; right: 55px; width: 32px; height: 32px;
            background: rgba(0,0,0,0.05); border-radius: 50%; color: #881337;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            z-index: 20; font-size: 16px; transition: background 0.2s;
        }
        .paper-edit:active { background: rgba(0,0,0,0.1); }

        .paper-title { font-family: 'Georgia', serif; font-size: 28px; color: #831843; margin-bottom: 20px; font-weight: 700; z-index: 10; }
        .paper-body { font-family: 'Georgia', serif; font-size: 18px; line-height: 1.8; color: #374151; flex: 1; overflow-y: auto; white-space: pre-wrap; z-index: 10; }
        .paper-date { text-align: right; font-size: 13px; color: #9ca3af; font-style: italic; margin-top: 20px; z-index: 10; }

        /* Composer */
        .composer-sheet {
            position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1e;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5); z-index: 200;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 24px; max-height: 90vh; overflow-y: auto; border-top: 1px solid var(--border);
        }
        .composer-sheet.active { transform: translateY(0); }
        
        .composer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .btn-text { background: none; border: none; font-size: 16px; color: var(--primary); cursor: pointer; font-weight: 500; }
        .btn-text.cancel { color: #ef4444; }

        .input-group { margin-bottom: 20px; }
        .input-label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .input-text, .input-area, .input-select {
            width: 100%; background: #2c2c2e; border: none; border-radius: 12px;
            padding: 14px; color: #fff; font-size: 16px; font-family: inherit;
        }
        .input-area { min-height: 140px; resize: none; }

        /* Sync Footer */
        .sync-footer {
            position: fixed; bottom: 0; left: 0; right: 0; height: 30px;
            background: rgba(28,28,30,0.9); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; gap: 6px;
            font-size: 10px; color: var(--text-dim); border-top: 1px solid var(--border);
            z-index: 40;
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #32d74b; }
        .status-dot.offline { background: #ff453a; }
        .status-dot.loading { background: #ff9f0a; animation: pulse 1s infinite; }

        .empty-state { text-align: center; margin-top: 80px; color: var(--text-dim); font-size: 15px; }
        .hidden { display: none; }

    </style>
</head>
<body>

    <div class="topbar">
        <div class="back-placeholder"></div>
        <div class="title">Message Vault</div>
        <button class="action-btn" id="btnAdd">+</button>
    </div>

    <div class="tabs-container">
        <div class="segmented-control">
            <div class="segment-indicator" id="segIndicator"></div>
            <div class="segment-btn" onclick="filterList('all', 0)">Alle</div>
            <div class="segment-btn" onclick="filterList('locked', 1)">Locked</div>
            <div class="segment-btn" onclick="filterList('opened', 2)">Offen</div>
            <div class="segment-btn" onclick="filterList('pinned', 3)">Pinned</div>
        </div>
    </div>

    <div class="main-scroll" id="msgList">
        <!-- JS renders items here -->
        <div class="empty-state">Lade Tresor... 🔐</div>
    </div>

    <div class="sync-footer">
        <div class="status-dot loading" id="footerDot"></div>
        <span id="footerText">Verbinde...</span>
    </div>

    <!-- Reader -->
    <div class="reader-overlay" id="reader">
        <div class="paper-sheet" id="paperSheet">
            <div class="paper-texture"></div>
            <div class="paper-close" id="readerClose">✕</div>
            <div class="paper-edit hidden" id="readerEdit" onclick="editCurrent()">✎</div>
            <div class="paper-title" id="readerTitle">Titel</div>
            <div class="paper-body" id="readerBody">...</div>
            <div class="paper-date" id="readerDate">--</div>
        </div>
    </div>

    <!-- Composer -->
    <div class="composer-sheet" id="composer">
        <div class="composer-header">
            <button class="btn-text cancel" id="composerCancel">Abbrechen</button>
            <span style="font-weight:600; font-size:17px; color:#fff;">Neue Nachricht</span>
            <button class="btn-text" id="composerSave">Sichern</button>
        </div>

        <div class="input-group">
            <label class="input-label">Betreff</label>
            <input type="text" class="input-text" id="inpTitle" placeholder="Worum geht es?">
        </div>

        <div class="input-group">
            <label class="input-label">Nachricht</label>
            <textarea class="input-area" id="inpBody" placeholder="Deine geheimen Worte..."></textarea>
        </div>

        <div class="input-group">
            <label class="input-label">Schloss Typ</label>
            <select class="input-select" id="inpLockType">
                <option value="none">Kein Schloss (Sofort lesbar)</option>
                <option value="time">Zeit-Schloss ⏳</option>
                <option value="reward">Achievement Lock 🏆</option>
            </select>
        </div>

        <div class="input-group hidden" id="groupTime">
            <label class="input-label">Öffnen am</label>
            <input type="datetime-local" class="input-text" id="inpTime">
        </div>

        <div class="input-group hidden" id="groupReward">
            <label class="input-label">Benötigter Erfolg</label>
            <select class="input-select" id="inpRewardId">
                <!-- Populated by JS -->
            </select>
        </div>
    </div>

    <script src="vault.js"></script>
</body>
</html>
