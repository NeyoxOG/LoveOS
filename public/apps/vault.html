
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Message Vault</title>
    <style>
        :root {
            --bg-dark: #000;
            --bg-card: #1c1c1e;
            --primary: #ec4899; /* Pink */
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Header */
        .header {
            padding: 16px 24px;
            padding-top: calc(16px + env(safe-area-inset-top));
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }
        .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
        .add-btn { 
            width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: white;
            border: none; display: flex; align-items: center; justify-content: center; font-size: 24px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(236, 72, 153, 0.4); transition: transform 0.2s;
        }
        .add-btn:active { transform: scale(0.9); }

        /* Grid */
        .vault-grid {
            flex: 1; overflow-y: auto; padding: 24px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px; padding-bottom: 100px;
        }

        /* 3D Envelope Card */
        .envelope-wrapper {
            aspect-ratio: 1.2;
            perspective: 1000px;
            cursor: pointer;
        }
        
        .envelope {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .envelope-wrapper:active .envelope { transform: scale(0.95); }
        .envelope-wrapper.opened .envelope { opacity: 0.5; }

        /* Envelope Parts */
        .env-body {
            position: absolute; inset: 0;
            background: #27272a;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
            overflow: hidden;
        }
        
        /* The Flap Triangle Look via CSS Clip Path */
        .env-flap {
            position: absolute; top: 0; left: 0; right: 0; height: 60%;
            background: linear-gradient(to bottom, #3f3f46, #27272a);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 20; transform-origin: top;
            transition: transform 0.4s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }
        .envelope-wrapper.opened .env-flap { transform: rotateX(180deg); opacity: 0; }

        .env-seal {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--primary);
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            z-index: 25;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .env-content-preview {
            position: absolute; inset: 10px; background: #fff;
            z-index: 5; border-radius: 4px;
            transform: translateY(100%); /* Hidden inside */
            transition: transform 0.5s;
            display: flex; flex-direction: column; padding: 10px;
        }
        .envelope-wrapper.opened .env-content-preview { transform: translateY(-20px) scale(0.9); }

        .env-info {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            text-align: center; z-index: 30; pointer-events: none;
        }
        .env-title { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .env-timer { font-size: 10px; color: #fbbf24; font-family: monospace; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }

        /* Reader Overlay */
        .reader-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .reader-overlay.active { opacity: 1; pointer-events: auto; }
        
        .paper-sheet {
            width: 100%; max-width: 500px; height: 80vh; background: #fff1f2;
            border-radius: 2px; box-shadow: 0 0 50px rgba(255,255,255,0.1);
            padding: 40px; display: flex; flex-direction: column;
            transform: scale(0.9) rotate(-2deg); transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .reader-overlay.active .paper-sheet { transform: scale(1) rotate(0deg); }
        
        .paper-close { position: absolute; top: 15px; right: 15px; font-size: 24px; color: #881337; cursor: pointer; z-index: 20; }
        .paper-title { font-family: 'Georgia', serif; font-size: 24px; color: #831843; margin-bottom: 20px; font-weight: 700; z-index: 10; }
        .paper-body { font-family: 'Georgia', serif; font-size: 18px; line-height: 1.6; color: #374151; flex: 1; overflow-y: auto; white-space: pre-wrap; z-index: 10; }
        
        /* Composer */
        .composer-sheet {
            position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1e;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5); z-index: 200;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 24px; max-height: 90vh; overflow-y: auto; border-top: 1px solid var(--border);
        }
        .composer-sheet.active { transform: translateY(0); }
        
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
        .input-text, .input-area, .input-select {
            width: 100%; background: #2c2c2e; border: none; border-radius: 12px;
            padding: 14px; color: #fff; font-size: 16px; font-family: inherit;
        }
        .input-area { min-height: 120px; resize: none; }
        
        .btn-save { width: 100%; background: var(--primary); color: white; padding: 14px; border-radius: 16px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; }

        .hidden { display: none; }
        .empty-state { grid-column: 1 / -1; text-align: center; color: var(--text-dim); margin-top: 40px; }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">Tresor 🔐</div>
        <button class="add-btn" id="btnAdd">+</button>
    </div>

    <div class="vault-grid" id="vaultGrid">
        <div class="empty-state">Lade Geheimnisse...</div>
    </div>

    <!-- Reader -->
    <div class="reader-overlay" id="reader">
        <div class="paper-sheet">
            <div class="paper-close" onclick="closeReader()">✕</div>
            <div class="paper-title" id="readerTitle">...</div>
            <div class="paper-body" id="readerBody">...</div>
        </div>
    </div>

    <!-- Composer -->
    <div class="composer-sheet" id="composer">
        <div class="input-group">
            <label class="input-label">Titel</label>
            <input type="text" class="input-text" id="inpTitle" placeholder="Betreff">
        </div>
        <div class="input-group">
            <label class="input-label">Nachricht</label>
            <textarea class="input-area" id="inpBody" placeholder="Geheimer Inhalt..."></textarea>
        </div>
        <div class="input-group">
            <label class="input-label">Schloss</label>
            <select class="input-select" id="inpLockType">
                <option value="none">Offen</option>
                <option value="time">Zeit-Schloss ⏳</option>
            </select>
        </div>
        <div class="input-group hidden" id="groupTime">
            <label class="input-label">Öffnen am</label>
            <input type="datetime-local" class="input-text" id="inpTime">
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn-save" style="background:#333;" onclick="closeComposer()">Abbrechen</button>
            <button class="btn-save" onclick="saveMessage()">Einschließen</button>
        </div>
    </div>

    <script src="vault.js"></script>
</body>
</html>
