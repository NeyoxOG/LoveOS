
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Einstellungen</title>
    <style>
        :root {
            --bg-dark: #000;
            --bg-card: #1c1c1e;
            --primary: #818cf8;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            overflow-y: auto;
            user-select: none;
            padding: 20px;
            padding-bottom: 80px;
        }

        h1 { font-size: 32px; font-weight: 700; margin: 0 0 20px 0; }
        
        h2 { 
            font-size: 13px; text-transform: uppercase; color: var(--text-dim); 
            margin: 30px 0 10px 10px; letter-spacing: 0.5px;
        }

        .card-group {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
        }

        .list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            font-size: 16px;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:active { background: rgba(255,255,255,0.1); }

        .item-label { font-weight: 500; }
        .item-val { color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
        
        .avatar-preview { width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; justify-content: center; align-items: center; font-size: 16px; }

        input[type="text"] {
            background: transparent; border: none; color: #fff; text-align: right; font-size: 16px; outline: none; width: 150px;
        }

        /* Toggles */
        .toggle {
            width: 50px; height: 30px; background: #333; border-radius: 15px; position: relative; transition: 0.3s; cursor: pointer;
        }
        .toggle::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px;
            background: #fff; border-radius: 50%; transition: 0.3s;
        }
        .toggle.active { background: #34c759; }
        .toggle.active::after { transform: translateX(20px); }

        /* Grids */
        .grid-select {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 16px;
        }
        .theme-card {
            background: #333; border-radius: 8px; height: 60px; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 600; cursor: pointer; border: 2px solid transparent; position: relative;
        }
        .theme-card.selected { border-color: var(--primary); }

        .color-grid {
            display: flex; gap: 10px; padding: 16px; overflow-x: auto;
        }
        .color-swatch {
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; flex-shrink: 0;
        }
        .color-swatch.selected { border-color: #fff; }

        .btn-action {
            width: 100%; text-align: center; color: #007aff; padding: 16px; cursor: pointer; font-size: 16px; background: var(--bg-card); border:none;
            transition: opacity 0.2s;
        }
        .btn-destructive { color: #ff3b30; }
        .btn-action:disabled { opacity: 0.3; cursor: not-allowed; color: #888; }

        .hidden { display: none; }
        
        .dev-badge { float:right; font-size:10px; background:#333; padding:2px 6px; border-radius:4px; color:#aaa; margin-top:2px; }

    </style>
</head>
<body>

    <h1>Einstellungen</h1>

    <h2>Account</h2>
    <div class="card-group">
        <div class="list-item">
            <span class="item-label">Avatar</span>
            <div class="item-val" onclick="promptAvatar()">
                <div class="avatar-preview" id="avatarPreview">👤</div>
                <span>›</span>
            </div>
        </div>
        <div class="list-item">
            <span class="item-label">Name</span>
            <input type="text" id="inpName" placeholder="Dein Name" onchange="saveProfile()">
        </div>
        <div class="list-item">
            <span class="item-label">Rolle</span>
            <span class="item-val" id="valRole">User</span>
        </div>
    </div>

    <h2>Look & Feel</h2>
    <div class="card-group">
        <div class="list-item" style="flex-direction: column; align-items: flex-start;">
            <span class="item-label" style="margin-bottom: 10px;">Theme</span>
            <div class="grid-select" style="width:100%; padding:0; gap:8px;" id="themeGrid">
                <!-- JS populates -->
            </div>
        </div>
        <div class="list-item" style="flex-direction: column; align-items: flex-start;">
            <span class="item-label" style="margin-bottom: 10px;">Akzentfarbe</span>
            <div class="color-grid" style="width:100%; padding:0;" id="accentGrid">
                <div class="color-swatch" style="background: #ef4444" onclick="setAccent('#ef4444')"></div>
                <div class="color-swatch" style="background: #f97316" onclick="setAccent('#f97316')"></div>
                <div class="color-swatch" style="background: #eab308" onclick="setAccent('#eab308')"></div>
                <div class="color-swatch" style="background: #22c55e" onclick="setAccent('#22c55e')"></div>
                <div class="color-swatch" style="background: #06b6d4" onclick="setAccent('#06b6d4')"></div>
                <div class="color-swatch" style="background: #3b82f6" onclick="setAccent('#3b82f6')"></div>
                <div class="color-swatch" style="background: #8b5cf6" onclick="setAccent('#8b5cf6')"></div>
                <div class="color-swatch" style="background: #ec4899" onclick="setAccent('#ec4899')"></div>
            </div>
        </div>
        <div class="list-item">
            <span class="item-label">Bewegung reduzieren</span>
            <div class="toggle" id="toggleMotion" onclick="toggleMotion()"></div>
        </div>
    </div>

    <h2>Daten</h2>
    <div class="card-group">
        <button class="btn-action" onclick="exportData()">Daten exportieren (JSON)</button>
        <button class="btn-action btn-destructive" onclick="resetData()">Lokale Daten löschen</button>
    </div>

    <div id="devSection">
        <h2>Developer <span class="dev-badge">ADMIN ONLY</span></h2>
        <div class="card-group">
            <button class="btn-action dev-btn" onclick="devUnlockRewards()">All Rewards Unlock</button>
            <button class="btn-action btn-destructive dev-btn" onclick="devResetLuna()">Reset Luna</button>
        </div>
    </div>

    <script src="settings.js"></script>
</body>
</html>
