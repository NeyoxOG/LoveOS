
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake v2</title>
    <style>
        body { 
            margin:0; padding:0; 
            background: radial-gradient(circle at top, #16a34a 0%, #052e2b 55%, #021b16 100%);
            color: #fff; font-family: -apple-system, sans-serif; 
            overflow: hidden; user-select: none; touch-action: none; 
            display: flex; flex-direction: column; height: 100vh; 
        }
        
        /* Background */
        .bg-gradient {
            position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(circle at 30% 20%, rgba(134, 239, 172, 0.35) 0%, transparent 50%),
                        radial-gradient(circle at 80% 10%, rgba(74, 222, 128, 0.25) 0%, transparent 45%);
        }
        .bg-grid {
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Header UI */
        .header {
            position: relative; z-index: 10;
            padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.35); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .header-title { font-size: 18px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
        .score-pill {
            background: rgba(34, 197, 94, 0.25); border: 1px solid rgba(34, 197, 94, 0.4);
            color: #4ade80; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 16px;
        }
        .best-pill {
            background: rgba(59, 130, 246, 0.18);
            border: 1px solid rgba(59, 130, 246, 0.35);
            color: #bfdbfe;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .btn-icon {
            background: rgba(255,255,255,0.1); width: 36px; height: 36px;
            border-radius: 50%; border: none; color: white;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; cursor: pointer; transition: background 0.2s;
        }
        .btn-icon:active { background: rgba(255,255,255,0.2); }

        /* Game Area */
        .game-wrapper {
            flex: 1; display: flex; justify-content: center; align-items: center;
            position: relative; z-index: 5; padding: 20px;
        }
        canvas {
            box-shadow: 0 24px 60px rgba(0,0,0,0.6);
            border-radius: 16px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.12);
            max-width: 100%; max-height: 100%;
        }

        /* D-Pad Controls */
        .dpad-container {
            position: absolute; bottom: 24px; left: 0; right: 0;
            display: none; justify-content: center; align-items: center;
            pointer-events: none; z-index: 20;
        }
        .dpad-container.visible { display: flex; }
        
        .dpad {
            position: relative; width: 200px; height: 200px;
            pointer-events: auto;
        }
        .dpad-btn {
            position: absolute; width: 64px; height: 64px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: rgba(255,255,255,0.8);
            transition: transform 0.1s, background 0.1s;
        }
        .dpad-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.92); }
        
        .dpad-up { top: 0; left: 68px; }
        .dpad-down { bottom: 0; left: 68px; }
        .dpad-left { top: 68px; left: 0; }
        .dpad-right { top: 68px; right: 0; }

        /* Overlays */
        .overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            display: none; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 100; text-align: center;
        }
        .overlay.active { display: flex; animation: fadeIn 0.3s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .overlay h1 { font-size: 40px; margin: 0 0 10px 0; color: #fff; letter-spacing: -1px; }
        .overlay p { color: rgba(255,255,255,0.6); margin-bottom: 30px; font-size: 15px; }
        
        .btn-main { 
            background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; 
            padding: 14px 40px; border-radius: 30px; 
            font-size: 17px; font-weight: 700; cursor: pointer;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
            transition: transform 0.2s;
        }
        .btn-main:active { transform: scale(0.95); }
        
        .btn-sub { 
            background: transparent; border: 1px solid rgba(255,255,255,0.2); 
            color: rgba(255,255,255,0.8); margin-top: 16px; padding: 10px 24px; 
            border-radius: 20px; font-size: 14px; cursor: pointer; 
        }

        /* Floating Settings Toggle */
        .settings-toggle {
            position: absolute; bottom: 20px; right: 20px; z-index: 50;
            background: rgba(0,0,0,0.3); padding: 8px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1); cursor: pointer;
            color: rgba(255,255,255,0.5);
        }
        .settings-toggle.active { color: #fff; background: rgba(255,255,255,0.2); }
        .hint-pill {
            position: absolute;
            bottom: 24px;
            left: 20px;
            z-index: 50;
            font-size: 11px;
            color: rgba(255,255,255,0.65);
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 6px 10px;
            border-radius: 999px;
        }

    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    
    <div class="header">
        <button class="btn-icon" onclick="window.history.back()">✕</button>
        <div class="header-title">Snake v2 🐍</div>
        <div style="display:flex; gap:8px; align-items:center;">
            <div class="best-pill">Best: <span id="bestScore">0</span></div>
            <div class="score-pill" id="scoreEl">0</div>
        </div>
    </div>

    <div class="game-wrapper" id="gameArea">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- D-Pad -->
    <div class="dpad-container" id="dpadControls">
        <div class="dpad">
            <div class="dpad-btn dpad-up" data-key="ArrowUp">▲</div>
            <div class="dpad-btn dpad-left" data-key="ArrowLeft">◀</div>
            <div class="dpad-btn dpad-right" data-key="ArrowRight">▶</div>
            <div class="dpad-btn dpad-down" data-key="ArrowDown">▼</div>
        </div>
    </div>

    <button class="settings-toggle" id="btnToggleControls" onclick="toggleControls()">🎮</button>
    <div class="hint-pill">Swipe oder D-Pad für Bewegung</div>

    <!-- Start Screen -->
    <div class="overlay active" id="startScreen">
        <h1>Snake v2</h1>
        <p>Sammle Herzen ❤️<br>Weiche dem lila Gegner aus! 👿</p>
        <button class="btn-main" onclick="startGame()">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div class="overlay" id="endScreen">
        <h1 style="color:#ef4444">Game Over</h1>
        <p>Score: <span id="finalScore" style="color:#fff; font-weight:bold;">0</span><br><span style="font-size:12px">Best: <span id="bestScore">0</span></span></p>
        <button class="btn-main" onclick="startGame()">Nochmal</button>
        <button class="btn-sub" onclick="window.history.back()">Beenden</button>
    </div>

    <script src="game_snake.js"></script>

    <script>
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') window.history.back();
        });
    </script>

</body>
</html>
