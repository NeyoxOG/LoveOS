
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake</title>
    <style>
        body { margin:0; padding:0; background:#000; color:#fff; font-family:-apple-system, sans-serif; overflow:hidden; user-select:none; touch-action:none; display:flex; flex-direction:column; height:100vh; }
        
        /* Subtle Grid Background */
        .bg-grid {
            position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .top-ui { 
            position:absolute; top:0; left:0; right:0; padding:20px; 
            display:flex; justify-content:space-between; z-index:10; pointer-events:none; 
        }
        .score-box { font-size:24px; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,0.5); }
        .score-box small { font-size:14px; opacity:0.6; font-weight:400; display:block; }

        .game-area { 
            flex:1; position:relative; overflow:hidden; 
            background: radial-gradient(circle at center, #064e3b 0%, #022c22 100%); 
            display: flex; justify-content: center; align-items: center;
        }
        
        canvas { 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            border: 2px solid rgba(255,255,255,0.1); 
            border-radius: 4px;
            background: rgba(0,0,0,0.2);
            z-index: 5;
        }

        .btn-close { 
            position:absolute; top:16px; left:16px; 
            background:rgba(255,255,255,0.1); width:40px; height:40px; 
            border-radius:50%; border:none; color:white; font-size:20px; 
            cursor:pointer; z-index:30; pointer-events:auto; 
            display:flex; justify-content:center; align-items:center;
        }

        .overlay {
            position:absolute; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px);
            display:none; flex-direction:column; justify-content:center; align-items:center; 
            z-index:100; text-align:center;
        }
        .overlay.active { display:flex; }
        
        .overlay h1 { font-size:40px; margin:0 0 10px 0; color: #4ade80; }
        .overlay p { color:#aaa; margin-bottom:30px; }
        
        .btn-start { 
            background:#22c55e; color:black; border:none; 
            padding:14px 40px; border-radius:30px; 
            font-size:18px; font-weight:700; cursor:pointer;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
            transition: transform 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }
        .btn-exit { 
            background:transparent; border:1px solid rgba(255,255,255,0.2); 
            color: white; margin-top:16px; padding:10px 30px; 
            border-radius:20px; font-size:14px; cursor:pointer; 
        }

        /* Virtual D-Pad for debugging touch logic if needed, but swipe is primary */
        .controls-hint {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            font-size: 12px; color: rgba(255,255,255,0.3); z-index: 5; pointer-events: none;
        }

    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <button class="btn-close" onclick="window.history.back()">✕</button>
    
    <div class="top-ui">
        <div></div> <!-- Spacer -->
        <div class="score-box" style="text-align:right">
            <span id="scoreEl">0</span>
            <small id="bestEl">Best: 0</small>
        </div>
    </div>

    <div class="game-area" id="gameArea">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls-hint">Swipe to Move</div>

    <div class="overlay active" id="startScreen">
        <h1>Snake</h1>
        <p>Sammle Herzen ❤️</p>
        <button class="btn-start" onclick="startGame()">Start Game</button>
    </div>

    <div class="overlay" id="endScreen">
        <h1 style="color:#ef4444">Game Over</h1>
        <p>Score: <span id="finalScore">0</span></p>
        <button class="btn-start" onclick="startGame()">Play Again</button>
        <button class="btn-exit" onclick="window.history.back()">Exit</button>
    </div>

    <script src="game_snake.js"></script>
</body>
</html>
