
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tagebuch</title>
    <style>
        :root {
            --bg-dark: #000;
            --bg-card: #1c1c1e;
            --primary: #f59e0b;
            --text: #fff;
            --text-dim: rgba(255,255,255,0.5);
            --border: rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden; user-select: none;
        }

        /* Header */
        .header {
            padding: 20px 24px;
            padding-top: calc(20px + env(safe-area-inset-top));
            background: rgba(28,28,30,0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50;
        }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .view-toggle { 
            background: rgba(255,255,255,0.1); border-radius: 8px; padding: 4px; display: flex; gap: 4px;
        }
        .view-btn {
            width: 32px; height: 32px; border-radius: 6px; border: none; background: transparent; color: var(--text-dim);
            font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .view-btn.active { background: #fff; color: #000; }

        /* Mood Chart Area */
        .mood-chart-container {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(28,28,30,0.3);
        }
        .chart-title { font-size: 12px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; font-weight: 600; }
        .chart-bars { display: flex; align-items: flex-end; justify-content: space-between; height: 60px; gap: 8px; }
        .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .bar-bg { width: 8px; height: 100%; background: rgba(255,255,255,0.05); border-radius: 4px; position: relative; overflow: hidden; }
        .bar-fill { position: absolute; bottom: 0; left: 0; right: 0; background: var(--primary); border-radius: 4px; transition: height 0.5s; }
        .col-label { font-size: 10px; color: var(--text-dim); }

        /* Main Scroll */
        .scroll-area { flex: 1; overflow-y: auto; padding-bottom: 80px; }

        /* Calendar View */
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
            padding: 20px; display: none; /* hidden by default */
        }
        .cal-day {
            aspect-ratio: 1; border-radius: 8px; background: var(--bg-card);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; position: relative; border: 1px solid transparent;
            cursor: pointer;
        }
        .cal-day.has-entry { border-color: var(--primary); background: rgba(245, 158, 11, 0.1); }
        .cal-dot { width: 4px; height: 4px; background: var(--primary); border-radius: 50%; margin-top: 4px; }
        
        /* List View */
        .entry-list { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .entry-card {
            background: var(--bg-card); border-radius: 20px; padding: 20px;
            display: flex; gap: 16px; border: 1px solid var(--border);
            cursor: pointer; transition: transform 0.2s;
        }
        .entry-card:active { transform: scale(0.98); }
        
        .entry-mood-box {
            width: 50px; height: 50px; border-radius: 14px; background: rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
        }
        .entry-info { flex: 1; min-width: 0; }
        .entry-date { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
        .entry-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .entry-snippet { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* FAB */
        .fab {
            position: fixed; bottom: 30px; right: 24px;
            width: 60px; height: 60px; border-radius: 50%;
            background: #fff; color: #000; box-shadow: 0 4px 20px rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center; font-size: 30px;
            cursor: pointer; transition: transform 0.2s; z-index: 60;
        }
        .fab:active { transform: scale(0.9); }

        /* Editor & Detail Styles recycled/simplified from previous version */
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
            display: flex; flex-direction: column; justify-content: flex-end;
        }
        .sheet-overlay.active { opacity: 1; pointer-events: auto; }
        
        .sheet {
            background: #1c1c1e; border-top-left-radius: 24px; border-top-right-radius: 24px;
            height: 90vh; border-top: 1px solid var(--border); padding: 24px;
            transform: translateY(100%); transition: transform 0.3s; display: flex; flex-direction: column;
        }
        .sheet-overlay.active .sheet { transform: translateY(0); }
        
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .btn-text { background: none; border: none; font-size: 16px; color: var(--primary); font-weight: 600; cursor: pointer; }
        .btn-text.cancel { color: #ef4444; }

        .input-title { width: 100%; background: transparent; border: none; font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 16px; outline: none; }
        .input-body { flex: 1; width: 100%; background: transparent; border: none; font-size: 17px; line-height: 1.6; color: #e5e5e5; outline: none; resize: none; font-family: inherit; }
        
        .mood-selector { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .mood-opt { font-size: 24px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 12px; cursor: pointer; border: 2px solid transparent; }
        .mood-opt.selected { border-color: var(--primary); background: rgba(245, 158, 11, 0.1); }

    </style>
</head>
<body>

    <div class="header">
        <h1>Journal</h1>
        <div class="view-toggle">
            <button class="view-btn active" id="btnList" onclick="setView('list')">☰</button>
            <button class="view-btn" id="btnCal" onclick="setView('calendar')">📅</button>
        </div>
    </div>

    <div class="mood-chart-container" id="moodChart">
        <div class="chart-title">Stimmung (Letzte 7 Einträge)</div>
        <div class="chart-bars" id="chartBars">
            <!-- JS Populated -->
        </div>
    </div>

    <div class="scroll-area">
        <div class="entry-list" id="listView">
            <!-- List Items -->
        </div>
        <div class="calendar-grid" id="calendarView">
            <!-- Calendar Days -->
        </div>
    </div>

    <div class="fab" onclick="openEditor()">+</div>

    <!-- Editor -->
    <div class="sheet-overlay" id="editor">
        <div class="sheet">
            <div class="sheet-header">
                <button class="btn-text cancel" onclick="closeEditor()">Abbrechen</button>
                <span style="font-weight:600">Eintrag</span>
                <button class="btn-text" onclick="saveEntry()">Fertig</button>
            </div>
            
            <div class="mood-selector" id="moodSel">
                <div class="mood-opt" onclick="setMood('💗')">💗</div>
                <div class="mood-opt" onclick="setMood('😊')">😊</div>
                <div class="mood-opt" onclick="setMood('😐')">😐</div>
                <div class="mood-opt" onclick="setMood('😔')">😔</div>
                <div class="mood-opt" onclick="setMood('😡')">😡</div>
                <div class="mood-opt" onclick="setMood('✨')">✨</div>
                <div class="mood-opt" onclick="setMood('🌙')">🌙</div>
            </div>

            <input type="text" class="input-title" id="inpTitle" placeholder="Überschrift">
            <textarea class="input-body" id="inpBody" placeholder="Was bewegt dich heute?"></textarea>
        </div>
    </div>

    <script src="diary.js"></script>
</body>
</html>
