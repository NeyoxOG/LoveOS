
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luna 3D</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --text: #f8fafc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background: #000;
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, system-ui, sans-serif;
        }

        /* 3D Canvas */
        #scene-container {
            position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(to bottom, #1e1b4b 0%, #000 100%);
        }
        
        /* UI Overlay */
        .ui-layer {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none; /* Let clicks pass to 3D */
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px;
        }

        .header {
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        
        .status-badge {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; gap: 10px; align-items: center; pointer-events: auto;
        }
        .status-icon { font-size: 18px; }
        .status-text { font-size: 13px; font-weight: 600; }

        .bars-container {
            display: flex; flex-direction: column; gap: 6px; width: 100px;
        }
        .bar-wrap { height: 4px; background: rgba(0,0,0,0.3); border-radius: 2px; overflow: hidden; display: flex; }
        .bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }

        /* Draggable Items Dock */
        .dock {
            display: flex; justify-content: center; gap: 20px;
            pointer-events: auto; padding-bottom: 20px;
        }
        
        .item {
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; cursor: grab;
            transition: transform 0.2s, background 0.2s;
            position: relative;
        }
        .item:active { cursor: grabbing; transform: scale(0.9); background: rgba(255,255,255,0.2); }
        .item-label {
            position: absolute; bottom: -18px; font-size: 10px; color: rgba(255,255,255,0.6);
            white-space: nowrap;
        }

        /* Drag Proxy */
        .drag-proxy {
            position: fixed; top: 0; left: 0; width: 60px; height: 60px;
            font-size: 40px; pointer-events: none; z-index: 100;
            display: none; align-items: center; justify-content: center;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }

        /* Notifications */
        .bubble {
            position: absolute; top: 30%; left: 50%; transform: translateX(-50%) scale(0);
            background: #fff; color: #000; padding: 10px 20px; border-radius: 20px;
            font-weight: 700; font-size: 14px; pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .bubble.show { transform: translateX(-50%) scale(1); }
        .bubble::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid #fff;
        }

        #interaction-hint {
            position: absolute; bottom: 120px; width: 100%; text-align: center;
            font-size: 12px; color: rgba(255,255,255,0.4); opacity: 0; animation: fadeHint 5s 2s forwards;
        }
        @keyframes fadeHint { 0% {opacity:0;} 100% {opacity:1;} }

    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="scene-container"></div>

    <div class="ui-layer">
        <div class="header">
            <div class="status-badge">
                <span class="status-icon">💖</span>
                <div class="bars-container">
                    <div class="bar-wrap"><div class="bar-fill" id="bar-love" style="width: 50%; background: #ec4899;"></div></div>
                    <div class="bar-wrap"><div class="bar-fill" id="bar-hunger" style="width: 80%; background: #f59e0b;"></div></div>
                    <div class="bar-wrap"><div class="bar-fill" id="bar-energy" style="width: 70%; background: #38bdf8;"></div></div>
                </div>
            </div>
            <div class="status-badge">
                <span class="status-icon">💤</span>
                <span class="status-text" id="status-text">Wach</span>
            </div>
        </div>

        <div id="interaction-hint">Streichle Luna oder ziehe Essen zu ihr</div>

        <div class="bubble" id="speech-bubble">Mäh!</div>

        <div class="dock">
            <div class="item" onmousedown="startDrag(event, 'apple')" ontouchstart="startDrag(event, 'apple')">
                🍎<span class="item-label">Apfel</span>
            </div>
            <div class="item" onmousedown="startDrag(event, 'star')" ontouchstart="startDrag(event, 'star')">
                🌟<span class="item-label">Stern</span>
            </div>
            <div class="item" onmousedown="startDrag(event, 'water')" ontouchstart="startDrag(event, 'water')">
                💧<span class="item-label">Wasser</span>
            </div>
            <div class="item" onclick="toggleSleep()">
                🌙<span class="item-label">Schlaf</span>
            </div>
        </div>
    </div>

    <div class="drag-proxy" id="dragProxy">🍎</div>

    <script src="luna.js"></script>
</body>
</html>
