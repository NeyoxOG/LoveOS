
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nachrichten</title>
    <style>
        :root {
            --bg-dark: #000;
            --bg-msg-me: #0a84ff;
            --bg-msg-other: #26262a;
            --text: #fff;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Top Bar */
        .topbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }
        .title { font-size: 17px; font-weight: 600; text-align: center; }

        /* Chat Area */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }
        
        .message.me {
            align-self: flex-end;
            background: var(--bg-msg-me);
            border-bottom-right-radius: 4px;
        }
        
        .message.other {
            align-self: flex-start;
            background: var(--bg-msg-other);
            border-bottom-left-radius: 4px;
        }

        .msg-meta {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            text-align: right;
        }

        /* Input Area */
        .input-bar {
            padding: 10px 16px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: #1c1c1e;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .chat-input:focus { border-color: #0a84ff; }

        .send-btn {
            background: #0a84ff;
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .send-btn:active { opacity: 0.8; }

        .empty-state { text-align: center; color: #666; margin-top: 50px; font-size: 14px; }

    </style>
</head>
<body>

    <div class="topbar">
        <div class="title">Chat 💬</div>
    </div>

    <div class="chat-list" id="chatList">
        <div class="empty-state">Lade Nachrichten...</div>
    </div>

    <div class="input-bar">
        <input type="text" class="chat-input" id="msgInput" placeholder="Nachricht...">
        <button class="send-btn" onclick="send()">➤</button>
    </div>

    <script src="messages.js"></script>
</body>
</html>
