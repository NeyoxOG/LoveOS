
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Daily</title>
    <style>
        :root {
            --bg-dark: #000;
            --bg-card: #1c1c1e;
            --primary: #fbbf24; /* Amber/Gold */
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100dvh; /* Mobile viewport fix */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Top Bar */
        .topbar {
            padding: 16px 20px;
            padding-top: calc(16px + env(safe-area-inset-top)); /* Safe area top */
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
            flex-shrink: 0;
        }
        .title { font-size: 17px; font-weight: 600; text-align: center; }

        /* Content */
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
            /* Ensure bottom content isn't hidden behind home bar */
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Today Card - Responsive Fixes */
        .today-card {
            background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
            border-radius: 24px;
            /* Responsive padding using clamp */
            padding: 24px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative; 
            overflow: hidden;
            width: 100%;
            max-width: 400px; /* Prevent overflow on small screens */
            margin: 0 auto;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
            /* Use gap for spacing instead of margins to prevent collapse issues */
            gap: 12px;
            flex-shrink: 0;
        }
        
        .shine {
            position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            animation: shine 3s infinite;
            pointer-events: none;
        }
        @keyframes shine { 0% { left: -100%; } 100% { left: 200%; } }

        /* Claim Animation Classes */
        .today-card.claiming {
            transform: scale(1.02);
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.3);
            border-color: rgba(251, 191, 36, 0.5);
        }
        .today-card.claiming .today-icon {
            animation: flyUp 0.6s ease-out forwards;
        }
        @keyframes flyUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-50px) scale(0); opacity: 0; }
        }

        /* Elements inside card - Reset margins, use gap from parent */
        .today-icon {
            font-size: 60px; /* Fixed robust size */
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.4));
            transition: transform 0.3s;
            line-height: 1;
            margin: 4px 0;
        }
        .today-title { 
            font-size: 22px; 
            font-weight: 800; 
            color: #fff; 
            line-height: 1.2;
        }
        .today-subtitle { 
            font-size: 13px; 
            color: var(--text-dim); 
            max-width: 95%; 
            line-height: 1.4;
            margin-bottom: 8px; /* Extra space before button */
        }
        
        .claim-btn {
            background: #fff; color: #000; border: none; 
            padding: 14px 24px; 
            border-radius: 30px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s, background 0.3s;
            position: relative; z-index: 10;
            width: 100%;
            max-width: 220px;
            -webkit-tap-highlight-color: transparent;
        }
        .claim-btn:active { transform: scale(0.95); }
        .claim-btn.disabled { 
            background: rgba(255,255,255,0.1); 
            color: rgba(255,255,255,0.4); 
            box-shadow: none; 
            pointer-events: none; 
            cursor: default;
        }

        .streak-row {
            display: flex; gap: 6px; align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 6px 12px;
            border-radius: 20px;
        }
        .streak-fire { font-size: 14px; margin-right: 4px; filter: drop-shadow(0 0 5px #ef4444); }
        .streak-dot {
            width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.1);
            transition: background 0.3s;
        }
        .streak-dot.active { background: #fbbf24; box-shadow: 0 0 5px #fbbf24; }

        /* Couple Bonus Badge */
        .couple-bonus {
            margin-top: 4px;
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            padding: 6px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 700; color: #fff;
            box-shadow: 0 4px 10px rgba(236, 72, 153, 0.4);
            display: none; animation: pulse 2s infinite;
        }
        .couple-bonus.active { display: inline-block; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Points Bar */
        .points-bar {
            background: #27272a; border-radius: 12px; padding: 12px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .points-val { color: var(--primary); font-weight: 800; font-size: 16px; }
        .points-next { font-size: 11px; color: var(--text-dim); }

        /* Inbox */
        .section-title { font-size: 13px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 10px; padding-left: 4px; }
        
        .inbox-list { display: flex; flex-direction: column; gap: 12px; }
        .inbox-item {
            background: var(--bg-card); border-radius: 16px; padding: 16px;
            display: flex; align-items: center; gap: 16px;
            border: 1px solid var(--border);
        }
        .inbox-icon {
            width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.05);
            display: flex; justify-content: center; align-items: center; font-size: 22px;
            flex-shrink: 0;
        }
        .inbox-info { flex: 1; min-width: 0; }
        .inbox-head { font-weight: 600; font-size: 15px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .inbox-body { font-size: 12px; color: var(--text-dim); line-height: 1.3; }
        
        /* History */
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
        .history-card {
            background: var(--bg-card); border-radius: 12px; padding: 10px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            border: 1px solid var(--border);
        }
        .h-date { font-size: 9px; color: var(--text-dim); }
        .h-icon { font-size: 18px; }
        .h-type { font-size: 9px; font-weight: 600; color: #fbbf24; text-transform: uppercase; }

        /* Confetti Overlay */
        .confetti-container {
            position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden;
        }
        .confetti {
            position: absolute; width: 8px; height: 8px; background: #f00;
            animation: fall 3s linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Claim Modal */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            z-index: 200; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s;
            padding: 20px;
        }
        .modal.active { display: flex; opacity: 1; }
        
        .modal-card {
            background: #1c1c1e; border-radius: 30px; padding: 40px; text-align: center;
            width: 100%; max-width: 320px; border: 1px solid rgba(255,255,255,0.1);
            transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 80vh; overflow-y: auto;
        }
        .modal.active .modal-card { transform: scale(1); }
        
        .modal-icon { font-size: 80px; margin-bottom: 20px; display: block; animation: bounce 1s infinite; }
        .modal-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #fff; }
        .modal-text { font-size: 16px; color: var(--text-dim); margin-bottom: 30px; line-height: 1.5; }
        
        .modal-btn {
            background: var(--primary); color: #000; border: none; padding: 14px 24px;
            border-radius: 20px; font-weight: 700; cursor: pointer; width: 100%;
            font-size: 16px;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Dev Tools - Admin Only - Hidden by default */
        .dev-tools { margin-top: 20px; padding: 20px; border-top: 1px solid var(--border); padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .dev-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
        .dev-badge { background:#333; color:#aaa; font-size:10px; padding:2px 6px; border-radius:4px; text-transform:uppercase; font-weight:bold; }
        
        .dev-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .dev-btn { 
            background: #333; color: #fff; border: none; padding: 10px 16px; 
            border-radius: 12px; font-size: 12px; cursor: pointer; flex: 1;
            transition: opacity 0.2s; white-space: nowrap;
        }
        .dev-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    </style>
</head>
<body>

    <div class="topbar">
        <div class="title">Daily ✨</div>
    </div>

    <div class="content">
        
        <!-- Points -->
        <div class="points-bar">
            <div>
                <div style="font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#aaa;">Punkte</div>
                <div class="points-val" id="pointsVal">0</div>
            </div>
            <div class="points-next" id="pointsNext">Noch 100 bis Royal Theme 👑</div>
        </div>

        <!-- Today -->
        <div class="today-card" id="todayCard">
            <div class="shine"></div>
            <div class="streak-row" id="streakRow">
                <span class="streak-fire">🔥</span>
                <!-- Dots populated by JS -->
            </div>
            
            <div class="today-icon" id="todayIcon">🎁</div>
            <div class="today-title" id="todayTitle">Tagesbelohnung</div>
            <div class="today-subtitle" id="todaySub">Hol dir deine tägliche Überraschung ab!</div>
            
            <button class="claim-btn" id="claimBtn" onclick="doClaim()">Heute abholen</button>
            
            <div class="couple-bonus" id="coupleBonus">Couple Bonus aktiv 💗</div>
        </div>

        <!-- Inbox -->
        <div>
            <div class="section-title">Überraschungs-Inbox 💌</div>
            <div class="inbox-list" id="inboxList">
                <div style="text-align:center; color:#444; font-size:12px; padding:20px;">Leer</div>
            </div>
        </div>

        <!-- History -->
        <div>
            <div class="section-title">Verlauf</div>
            <div class="history-grid" id="historyGrid">
                <!-- Items -->
            </div>
        </div>

        <!-- Dev - Securely hidden by default -->
        <div class="dev-tools" id="devTools" style="display: none;">
            <div class="dev-header">
                <div class="section-title" style="margin:0">Developer Options</div>
                <div class="dev-badge">Admin Only</div>
            </div>
            <div class="dev-actions">
                <button class="dev-btn" onclick="devReset()">Reset Status</button>
                <button class="dev-btn" onclick="devStreakReset()">Reset Streak</button>
                <button class="dev-btn" onclick="devReroll()">Force Reroll</button>
            </div>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal" id="claimModal">
        <div class="modal-card">
            <div class="modal-icon" id="mIcon">✨</div>
            <div class="modal-title" id="mTitle">Belohnung!</div>
            <div class="modal-text" id="mText">...</div>
            <button class="modal-btn" onclick="closeModal()">Danke!</button>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <script src="daily.js"></script>
</body>
</html>
