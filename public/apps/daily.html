<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily</title>
    <style>
        :root {
            --bg-dark: #000;
            --bg-card: #1c1c1e;
            --primary: #fbbf24; /* Amber/Gold */
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Top Bar */
        .topbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }
        .title { font-size: 17px; font-weight: 600; text-align: center; }

        /* Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Today Card */
        .today-card {
            background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
            border-radius: 24px;
            padding: 24px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
        }
        
        .shine {
            position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            animation: shine 3s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 100% { left: 200%; } }

        .today-icon {
            font-size: 64px; margin-bottom: 16px;
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.4));
        }
        .today-title { font-size: 24px; font-weight: 800; margin-bottom: 4px; color: #fff; }
        .today-subtitle { font-size: 14px; color: var(--text-dim); margin-bottom: 24px; max-width: 80%; }
        
        .claim-btn {
            background: #fff; color: #000; border: none; padding: 14px 32px; border-radius: 30px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative; z-index: 10;
        }
        .claim-btn:active { transform: scale(0.95); }
        .claim-btn.disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); box-shadow: none; pointer-events: none; }

        .streak-row {
            display: flex; gap: 6px; margin-bottom: 16px;
        }
        .streak-dot {
            width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.1);
        }
        .streak-dot.active { background: #fbbf24; box-shadow: 0 0 5px #fbbf24; }

        /* Inbox */
        .section-title { font-size: 13px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 10px; padding-left: 4px; }
        
        .inbox-list { display: flex; flex-direction: column; gap: 12px; }
        .inbox-item {
            background: var(--bg-card); border-radius: 16px; padding: 16px;
            display: flex; align-items: center; gap: 16px;
            border: 1px solid var(--border);
        }
        .inbox-icon {
            width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.05);
            display: flex; justify-content: center; align-items: center; font-size: 24px;
        }
        .inbox-info { flex: 1; }
        .inbox-head { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
        .inbox-body { font-size: 12px; color: var(--text-dim); }
        
        /* History */
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
        .history-card {
            background: var(--bg-card); border-radius: 12px; padding: 10px;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            border: 1px solid var(--border);
        }
        .h-date { font-size: 10px; color: var(--text-dim); }
        .h-icon { font-size: 20px; }
        .h-type { font-size: 10px; font-weight: 600; color: #fbbf24; text-transform: uppercase; }

        /* Confetti Overlay */
        .confetti-container {
            position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden;
        }
        .confetti {
            position: absolute; width: 8px; height: 8px; background: #f00;
            animation: fall 3s linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Claim Modal */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            z-index: 200; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s;
        }
        .modal.active { display: flex; opacity: 1; }
        
        .modal-card {
            background: #1c1c1e; border-radius: 30px; padding: 40px; text-align: center;
            width: 90%; max-width: 320px; border: 1px solid rgba(255,255,255,0.1);
            transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal.active .modal-card { transform: scale(1); }
        
        .modal-icon { font-size: 80px; margin-bottom: 20px; display: block; animation: bounce 1s infinite; }
        .modal-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
        .modal-text { font-size: 16px; color: var(--text-dim); margin-bottom: 30px; line-height: 1.5; }
        
        .modal-btn {
            background: var(--primary); color: #000; border: none; padding: 12px 24px;
            border-radius: 20px; font-weight: 700; cursor: pointer; width: 100%;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Dev Tools */
        .dev-tools { margin-top: 40px; padding: 20px; border-top: 1px solid var(--border); display: none; }
        .dev-btn { background: #333; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 12px; margin-right: 8px; cursor: pointer; }

    </style>
</head>
<body>

    <div class="topbar">
        <div class="title">Daily ✨</div>
    </div>

    <div class="content">
        
        <!-- Today -->
        <div class="today-card">
            <div class="shine"></div>
            <div class="streak-row" id="streakRow">
                <!-- Dots -->
            </div>
            <div class="today-icon" id="todayIcon">🎁</div>
            <div class="today-title" id="todayTitle">Tagesbelohnung</div>
            <div class="today-subtitle" id="todaySub">Hol dir deine tägliche Überraschung ab!</div>
            <button class="claim-btn" id="claimBtn" onclick="doClaim()">Heute abholen</button>
        </div>

        <!-- Inbox -->
        <div>
            <div class="section-title">Überraschungs-Inbox 💌</div>
            <div class="inbox-list" id="inboxList">
                <div style="text-align:center; color:#444; font-size:12px; padding:20px;">Leer</div>
            </div>
        </div>

        <!-- History -->
        <div>
            <div class="section-title">Verlauf</div>
            <div class="history-grid" id="historyGrid">
                <!-- Items -->
            </div>
        </div>

        <!-- Dev -->
        <div class="dev-tools" id="devTools">
            <div class="section-title">Developer</div>
            <button class="dev-btn" onclick="devReset()">Reset Daily</button>
            <button class="dev-btn" onclick="devReroll()">Force Reroll</button>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal" id="claimModal">
        <div class="modal-card">
            <div class="modal-icon" id="mIcon">✨</div>
            <div class="modal-title" id="mTitle">Belohnung!</div>
            <div class="modal-text" id="mText">...</div>
            <button class="modal-btn" onclick="closeModal()">Danke!</button>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <script src="daily.js"></script>
</body>
</html>
