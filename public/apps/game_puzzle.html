<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle</title>
    <style>
        body { margin:0; background:#18181b; color:#fff; font-family:-apple-system; height:100vh; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; user-select:none; }
        
        .header { position:absolute; top:20px; width:100%; text-align:center; }
        .stats { font-size:18px; margin-top:10px; color:#aaa; }

        .board {
            width:300px; height:300px; background:#333; border-radius:12px; padding:5px;
            position:relative;
        }
        
        .tile {
            position:absolute; width:90px; height:90px; background:#4f46e5; border-radius:8px;
            display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:bold;
            transition:transform 0.2s ease-out;
            cursor:pointer;
            box-shadow:inset 0 0 0 2px rgba(255,255,255,0.1);
        }
        .tile.correct { background:#10b981; }

        .btn-close { position:absolute; top:16px; left:16px; background:rgba(255,255,255,0.1); width:40px; height:40px; border-radius:50%; border:none; color:white; font-size:20px; cursor:pointer; }
        .btn-shuffle { position:absolute; bottom:40px; padding:12px 30px; background:#f472b6; border:none; border-radius:20px; color:white; font-weight:bold; font-size:16px; cursor:pointer; }

        .overlay { position:absolute; inset:0; background:rgba(0,0,0,0.9); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; display:none; }
        .overlay.active { display:flex; }
        .overlay h1 { font-size:40px; margin-bottom:10px; color:#4ade80; }

    </style>
</head>
<body>
    <button class="btn-close" onclick="window.history.back()">✕</button>

    <div class="header">
        <h2>Slider Puzzle</h2>
        <div class="stats">Time: <span id="time">0.0</span>s</div>
    </div>

    <div class="board" id="board">
        <!-- Tiles -->
    </div>

    <button class="btn-shuffle" onclick="shuffle()">Shuffle</button>

    <div class="overlay" id="winScreen">
        <h1>Solved!</h1>
        <p>Time: <span id="finalTime"></span>s</p>
        <button class="btn-shuffle" style="position:static; margin-top:20px;" onclick="shuffle()">Play Again</button>
    </div>

    <script src="game_puzzle.js"></script>

    <script>
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') window.history.back();
        });
    </script>

</body>
</html>
