
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade</title>
    <style>
        :root {
            --bg-dark: #05010a;
            --bg-card: rgba(18, 18, 28, 0.92);
            --primary: #f472b6;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.55);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1f1147 0%, #090112 55%, #05010a 100%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Animated Background */
        .bg-mesh {
            position: absolute; inset: 0; z-index: -1;
            background: radial-gradient(circle at 0% 0%, #2e1065 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, #be185d 0%, transparent 50%);
            opacity: 0.4;
        }

        /* Top Bar */
        .topbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(12, 12, 20, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
            position: relative;
        }
        .title {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.4px;
        }
        .subtitle {
            position: absolute;
            left: 20px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .status-pill {
            position: absolute;
            right: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ef4444;
        }
        .status-pill.online .status-dot { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }

        /* Tabs */
        .tabs-container {
            padding: 12px 16px;
            background: rgba(12, 12, 20, 0.6);
        }
        .refresh-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

        /* Tabs */
        .tabs-wrapper { padding: 0 24px; margin-top: 16px; margin-bottom: 8px; flex-shrink: 0; }
        .segmented-control {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9px;
            padding: 2px;
            display: flex;
            position: relative;
        }
        .segment-btn {
            flex: 1; padding: 8px 0; text-align: center;
            font-size: 14px; font-weight: 600; color: #fff;
            z-index: 2; cursor: pointer; opacity: 0.8; transition: opacity 0.2s;
        }
        .segment-btn.active { opacity: 1; }
        .segment-indicator {
            position: absolute;
            top: 2px; bottom: 2px;
            width: 50%;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 7px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        /* Scroll Content */
        .content {
            flex: 1; overflow-y: auto; padding: 20px 24px;
            padding-bottom: 100px;
            display: flex; flex-direction: column; gap: 24px;
        }
        .hidden { display: none !important; }

        /* Hero Banner */
        .hero {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 24px; padding: 24px;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.3);
            display: flex; align-items: center; justify-content: space-between;
        }
        .hero-text { position: relative; z-index: 2; }
        .hero h2 { margin: 0; font-size: 22px; font-weight: 800; }
        .hero p { margin: 4px 0 0 0; font-size: 13px; opacity: 0.9; font-weight: 500; }
        .hero-icon { font-size: 60px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3)); transform: rotate(10deg); }
        .hero-bg {
            position: absolute; inset: 0; 
            background: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.1' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E");
            z-index: 1;
        }

        /* Grid Layout */
        .games-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
        }

        /* Game Card */
        .game-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 0 14px 40px rgba(4, 4, 12, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .game-card:active { transform: scale(0.98); box-shadow: 0 8px 24px rgba(4, 4, 12, 0.4); }
        .game-card:hover { box-shadow: 0 18px 48px rgba(4, 4, 12, 0.6); }

        .card-header {
            height: 140px;
            background: linear-gradient(135deg, #333, #000);
            position: relative;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1), transparent);
        }
        .card-header::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.2), transparent 45%);
            opacity: 0.6;
        }
        
        .card-icon { font-size: 56px; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.45)); z-index: 1; }
        
        .card-body { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
        .game-title { font-size: 19px; font-weight: 700; color: #fff; }
        .game-desc { font-size: 13px; color: var(--text-dim); }
        
        .game-meta { 
            display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
        }
        .score-badge { font-size: 12px; font-weight: 600; color: var(--primary); background: rgba(244, 114, 182, 0.15); padding: 6px 10px; border-radius: 999px; }
        
        .play-btn {
            background: #fff; color: #000; border: none; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .game-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
        .game-score { 
            font-size: 11px; font-weight: 600; color: #fbbf24; 
            background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 10px;
            display: inline-block; backdrop-filter: blur(4px);
        }

        /* Specific Gradients */
        .g-stack { background: linear-gradient(135deg, #be185d, #fb7185); }
        .g-reaction { background: linear-gradient(135deg, #7c3aed, #a78bfa); }
        .g-block { background: linear-gradient(135deg, #2563eb, #60a5fa); }
        .g-puzzle { background: linear-gradient(135deg, #059669, #34d399); }
        .g-snake { background: linear-gradient(135deg, #16a34a, #4ade80); }
        .g-flappy { background: linear-gradient(135deg, #0891b2, #22d3ee); }

        /* Leaderboard Styles */
        .lb-container { display: flex; flex-direction: column; gap: 24px; }
        .lb-section h3 { 
            font-size: 14px; text-transform: uppercase; color: var(--text-dim); 
            margin: 0 0 12px 4px; letter-spacing: 1px; 
        }
        
        .lb-list {
            background: var(--glass); border-radius: 20px;
            border: 1px solid var(--card-border); overflow: hidden;
        }
        .lb-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .lb-row:last-child { border-bottom: none; }
        
        .lb-rank { 
            width: 28px; font-weight: 800; font-size: 14px; 
            color: var(--text-dim); text-align: center; 
        }
        .lb-rank.top-1 { color: #fbbf24; font-size: 18px; }
        .lb-rank.top-2 { color: #94a3b8; font-size: 16px; }
        .lb-rank.top-3 { color: #b45309; font-size: 16px; }

        .lb-user { font-weight: 600; font-size: 15px; flex: 1; margin-left: 12px; }
        .lb-val { font-family: monospace; font-weight: 700; color: #ec4899; font-size: 15px; }

        .lb-section { margin-bottom: 30px; }
        .lb-title { font-size: 14px; font-weight: 600; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .lb-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .lb-refresh {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            color: #fff;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            cursor: pointer;
        }
        .lb-updated {
            font-size: 11px;
            color: var(--text-dim);
        }

    </style>
</head>
<body>

    <div class="bg-mesh"></div>

    <div class="topbar">
        <div class="subtitle">Game Hub</div>
        <div class="title">Arcade 💗</div>
        <div class="status-pill" id="cloudStatus">
            <span class="status-dot"></span>
            <span id="cloudStatusText">Offline</span>
        </div>
    </div>

    <div class="tabs-wrapper">
        <div class="segmented-control">
            <div class="segment-indicator" id="segIndicator"></div>
            <div class="segment-btn active" onclick="switchTab('games', 0)">Spiele</div>
            <div class="segment-btn" onclick="switchTab('stats', 1)">Rangliste</div>
        </div>
    </div>

    <div class="content">
        
        <!-- GAMES TAB -->
        <div id="tab-games" class="tab-content">
            
            <div class="hero">
                <div class="hero-bg"></div>
                <div class="hero-text">
                    <h2>Game of the Day</h2>
                    <p>Fordere deine Reflexe heraus!</p>
                </div>
                <div class="hero-icon">⚡</div>
            </div>

            <div class="game-card" onclick="playGame('reaction')">
                <div class="card-header" style="background: linear-gradient(135deg, #ef4444, #991b1b);">
                    <div class="card-icon">⏱️</div>
                </div>
                <div class="card-body">
                    <div class="game-title">Precision Timer</div>
                    <div class="game-desc">Drücke den roten Button exakt bei 3 Minuten.</div>
                    <div class="game-meta">
                        <span class="score-badge" id="best-reaction">Best: —</span>
                        <button class="play-btn">SPIELEN</button>
                    </div>
                </div>

                <div class="game-card g-reaction" onclick="playGame('reaction')">
                    <div class="card-visual">⏱️</div>
                    <div class="card-meta">
                        <div class="game-name">Precision</div>
                        <div class="game-score" id="best-reaction">Best: 0</div>
                    </div>
                </div>

                <div class="game-card g-block" onclick="playGame('blockblast')">
                    <div class="card-visual">🟦</div>
                    <div class="card-meta">
                        <div class="game-name">BlockBlast</div>
                        <div class="game-score" id="best-blockblast">Best: 0</div>
                    </div>
                </div>

                <div class="game-card g-snake" onclick="playGame('snake')">
                    <div class="card-visual">🐍</div>
                    <div class="card-meta">
                        <div class="game-name">Snake v2</div>
                        <div class="game-score" id="best-snake">Best: 0</div>
                    </div>
                </div>

                <div class="game-card g-flappy" onclick="playGame('flappy')">
                    <div class="card-visual">🐦</div>
                    <div class="card-meta">
                        <div class="game-name">Flappy</div>
                        <div class="game-score" id="best-flappy">Best: 0</div>
                    </div>
                </div>

                <div class="game-card g-puzzle" onclick="playGame('puzzle')">
                    <div class="card-visual">🧩</div>
                    <div class="card-meta">
                        <div class="game-name">Puzzle</div>
                        <div class="game-score" id="best-puzzle">Best: --</div>
                    </div>
                </div>

            </div>
        </div>

        <!-- STATS TAB -->
        <div id="tab-stats" class="hidden">
            <div class="lb-toolbar">
                <span class="lb-updated" id="lbUpdated">Zuletzt aktualisiert: —</span>
                <button class="lb-refresh" onclick="refreshLeaderboard()">Aktualisieren</button>
            </div>
            <div id="lb-container">
                <!-- Populated by JS -->
                <div style="text-align:center; padding: 20px; color:#666;">Lade Daten...</div>
            </div>
        </div>

    </div>

    <script src="games.js"></script>
</body>
</html>
