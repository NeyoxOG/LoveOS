<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mitteilungen</title>
  <style>
    :root {
      --bg: radial-gradient(circle at top, rgba(99,102,241,0.22), transparent 55%), linear-gradient(165deg,#090b1b 0%,#11142b 50%,#090b14 100%);
      --card: rgba(255,255,255,0.1);
      --border: rgba(255,255,255,0.14);
      --text: #f8fafc;
      --dim: rgba(226,232,240,0.7);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; color:var(--text); background:var(--bg); min-height:100vh; }
    .wrap { padding: 18px 16px 110px; }
    .header { display:flex; justify-content:space-between; align-items:end; margin-bottom:16px; }
    .title { font-size:30px; font-weight:700; }
    .sub { color:var(--dim); font-size:13px; }
    .tabs { display:flex; gap:8px; overflow:auto; margin-bottom:14px; }
    .tab { border:1px solid var(--border); background:var(--card); color:var(--dim); border-radius:14px; padding:8px 12px; font-size:12px; white-space:nowrap; }
    .tab.active { color:#fff; border-color:rgba(165,180,252,0.5); }
    .list { display:grid; gap:10px; }
    .item { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:12px; }
    .row { display:flex; justify-content:space-between; gap:8px; }
    .tag { font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(148,163,184,0.24); color:#dbeafe; }
    .msg { margin-top:8px; font-size:14px; line-height:1.35; }
    .time { margin-top:6px; color:var(--dim); font-size:12px; }
    .empty { text-align:center; color:var(--dim); padding:32px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">Mitteilungen</div>
        <div class="sub">Ruhige Updates statt Stress-Pushs</div>
      </div>
      <button class="tab" onclick="markAllRead()">Alle gelesen</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" style="display:none;">Keine Mitteilungen in dieser Kategorie ✨</div>
  </div>
  <script src="notifications.js"></script>
</body>
</html>
