
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Valentinstag</title>
    <style>
        :root {
            --bg-dark: #000;
            --primary: #f43f5e; /* Rose */
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at center, #3f0e1a 0%, #000 100%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255,255,255,0.1); width: 40px; height: 40px;
            border-radius: 50%; border: none; color: white;
            font-size: 20px; cursor: pointer; z-index: 50;
            display: flex; align-items: center; justify-content: center;
        }

        .container {
            text-align: center;
            width: 90%; max-width: 400px;
            position: relative; z-index: 10;
        }

        .heart-float {
            font-size: 60px;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.6));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.1); }
        }

        h1 {
            font-size: 32px; font-weight: 800; margin: 0 0 10px 0;
            background: linear-gradient(to right, #fff, #f43f5e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .subtitle { font-size: 16px; color: var(--text-dim); margin-bottom: 40px; }

        /* Timer */
        .timer-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            margin-bottom: 40px;
        }
        .timer-item {
            background: rgba(255,255,255,0.05);
            border-radius: 16px; padding: 16px 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .time-val { font-size: 24px; font-weight: 700; display: block; font-variant-numeric: tabular-nums; }
        .time-label { font-size: 10px; text-transform: uppercase; color: var(--text-dim); margin-top: 4px; }

        /* Button */
        .action-btn {
            background: linear-gradient(135deg, #f43f5e, #ec4899);
            border: none; color: white; padding: 16px 32px;
            border-radius: 30px; font-size: 18px; font-weight: 700;
            cursor: pointer; width: 100%;
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4);
            transition: transform 0.2s, opacity 0.2s;
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }

        /* Particles */
        .particle {
            position: absolute; pointer-events: none; opacity: 0.5;
            animation: rise 10s linear infinite;
        }
        @keyframes rise {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

    </style>
</head>
<body>

    <button class="back-btn" onclick="window.history.back()">✕</button>

    <!-- Background Particles -->
    <div id="particles"></div>

    <div class="container">
        <div class="heart-float">💘</div>
        
        <h1 id="headline">Bald ist es soweit</h1>
        <p class="subtitle" id="subtext">Der Tag der Liebe naht.</p>

        <div class="timer-grid" id="timerGrid">
            <div class="timer-item">
                <span class="time-val" id="d">00</span>
                <span class="time-label">Tage</span>
            </div>
            <div class="timer-item">
                <span class="time-val" id="h">00</span>
                <span class="time-label">Std</span>
            </div>
            <div class="timer-item">
                <span class="time-val" id="m">00</span>
                <span class="time-label">Min</span>
            </div>
            <div class="timer-item">
                <span class="time-val" id="s">00</span>
                <span class="time-label">Sek</span>
            </div>
        </div>

        <button class="action-btn" id="openBtn" onclick="openRewards()" disabled>
            Noch Geduld 🔒
        </button>
    </div>

    <script src="valentine.js"></script>
</body>
</html>
