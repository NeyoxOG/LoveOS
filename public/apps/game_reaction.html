
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Precision Timer</title>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:-apple-system; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; user-select:none; }
        
        .timer-display { font-size: 80px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
        .target-label { font-size: 16px; color: #a855f7; text-transform: uppercase; font-weight: 700; margin-bottom: 20px; }
        
        .btn-main {
            margin-top: 40px; width: 120px; height: 120px; border-radius: 50%;
            border: none; font-size: 24px; font-weight: 700; cursor: pointer;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.4);
            background: #ec4899; color: white;
            transition: transform 0.1s, background 0.3s;
        }
        .btn-main:active { transform: scale(0.95); }
        .btn-main.stop { background: #ef4444; box-shadow: 0 0 30px rgba(239, 68, 68, 0.4); }

        .result-box { 
            position: absolute; bottom: 100px; text-align: center; opacity: 0; transition: opacity 0.3s;
        }
        .result-box.show { opacity: 1; }
        .diff-val { font-size: 24px; font-weight: 700; }
        .score-val { color: #facc15; font-size: 18px; margin-top: 4px; }

        .btn-close { position:absolute; top:16px; left:16px; background:rgba(255,255,255,0.1); width:40px; height:40px; border-radius:50%; border:none; color:white; font-size:20px; cursor:pointer; }

    </style>
</head>
<body>
    <button class="btn-close" onclick="window.history.back()">✕</button>

    <div class="target-label">Target: 3.000s</div>
    <div class="timer-display" id="timer">0.000</div>

    <button class="btn-main" id="actionBtn" onmousedown="handleAction()" ontouchstart="handleAction(event)">
        Start
    </button>

    <div class="result-box" id="result">
        <div class="diff-val" id="diff">0.000</div>
        <div class="score-val" id="score">Score: 0</div>
    </div>

    <script src="game_reaction.js"></script>
</body>
</html>
