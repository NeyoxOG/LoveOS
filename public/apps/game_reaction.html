<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Precision Timer</title>
    <style>
        body {
            margin:0;
            background: radial-gradient(circle at top, #1f1147 0%, #0a0a14 55%, #000 100%);
            color:#fff;
            font-family:-apple-system, system-ui, sans-serif;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            height:100vh;
            user-select:none;
            touch-action:manipulation;
        }

        .game-ui {
            position:absolute;
            top:20px;
            width:100%;
            padding:0 20px;
            display:flex;
            justify-content:space-between;
            font-weight:700;
            font-size:16px;
            z-index:10;
        }
        .target-pill {
            background: rgba(239, 68, 68, 0.18);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fecaca;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .score-box { color:#f8fafc; }

        .center {
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:20px;
            text-align:center;
        }

        .timer {
            font-size:56px;
            font-weight:800;
            letter-spacing:1px;
            text-shadow:0 10px 30px rgba(0,0,0,0.45);
        }
        .timer-sub {
            font-size:14px;
            color:rgba(255,255,255,0.6);
        }

        .big-button {
            width:min(70vw, 260px);
            height:min(70vw, 260px);
            border-radius:50%;
            background: radial-gradient(circle at top, #f87171 0%, #ef4444 55%, #991b1b 100%);
            border: 6px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 50px rgba(239, 68, 68, 0.45), inset 0 -12px 30px rgba(0,0,0,0.35);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:22px;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:2px;
            color:#fff;
            cursor:pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        .big-button:active { transform: scale(0.97); box-shadow: 0 12px 30px rgba(239, 68, 68, 0.4); }

        .feedback {
            font-size:24px;
            font-weight:800;
            opacity:0;
            pointer-events:none;
            transition:transform 0.2s, opacity 0.2s;
        }
        .feedback.pop { opacity:1; transform:translateY(-10px) scale(1.1); }

        .overlay { position:absolute; inset:0; background:rgba(0,0,0,0.85); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; display:none; padding:24px; text-align:center; }
        .overlay.active { display:flex; }
        button { margin-top:20px; padding:12px 30px; border-radius:20px; border:none; background:#ef4444; color:white; font-weight:700; font-size:16px; cursor:pointer; }

        .btn-close { position:absolute; top:16px; left:16px; background:rgba(255,255,255,0.1); width:40px; height:40px; border-radius:50%; border:none; color:white; font-size:20px; cursor:pointer; z-index:30; }

    </style>
</head>
<body>
    <button class="btn-close" onclick="window.history.back()">✕</button>

    <div class="game-ui">
        <div class="score-box">Best: <span id="best">—</span></div>
        <div class="target-pill">Zielzeit 03:00</div>
    </div>

    <div class="center">
        <div class="timer" id="timer">00:00.000</div>
        <div class="timer-sub">Drücke den roten Button exakt bei 3 Minuten.</div>
        <button class="big-button" id="tapButton">STOP</button>
        <div class="feedback" id="feedback">Perfekt!</div>
    </div>

    <div class="overlay" id="startScreen" style="display:flex">
        <h1>Precision Timer</h1>
        <p style="color:#aaa; margin-bottom:20px;">Ziel: 03:00.000 treffen. Je näher, desto besser.</p>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div class="overlay" id="endScreen">
        <h1>Ergebnis</h1>
        <p>Abweichung: <span id="finalDiff">0</span> ms</p>
        <p style="font-size:14px; color:#aaa">Score: <span id="finalScore">0</span></p>
        <button onclick="startGame()">Play Again</button>
        <button style="background:transparent; border:1px solid #555" onclick="window.history.back()">Exit</button>
    </div>

    <script src="game_reaction.js"></script>

    <script>
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') window.history.back();
        });
    </script>

</body>
</html>
