
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: #0a0a0a;
            --border: #333;
            --primary: #00ff9d;
            --accent: #00b8ff;
            --danger: #ff0055;
            --text: #eee;
            --text-dim: #666;
            --font: 'JetBrains Mono', monospace;
        }

        body {
            margin: 0; padding: 0;
            background: var(--bg); color: var(--text);
            font-family: var(--font);
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            user-select: none;
        }

        /* CRT Scanline Effect */
        body::after {
            content: " ";
            display: block; position: absolute; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .header {
            padding: 16px 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 10, 10, 0.9);
        }
        .brand { font-weight: 700; letter-spacing: -1px; display: flex; align-items: center; gap: 8px; color: var(--text); }
        .brand span { color: var(--primary); }
        .status { font-size: 10px; background: rgba(0, 255, 157, 0.1); color: var(--primary); padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        .status.offline { color: var(--danger); background: rgba(255, 0, 85, 0.1); }

        .content {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 24px;
        }

        /* Widgets */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card {
            background: var(--panel); border: 1px solid var(--border);
            padding: 16px; border-radius: 4px; position: relative;
        }
        .card::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px;
            border-top: 1px solid var(--primary); border-left: 1px solid var(--primary);
        }
        
        .label { font-size: 10px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; letter-spacing: 1px; }
        .value { font-size: 24px; font-weight: 700; color: #fff; }
        
        /* Bar Charts */
        .bar-group { display: flex; flex-direction: column; gap: 8px; }
        .bar-row { display: flex; align-items: center; gap: 10px; font-size: 11px; }
        .bar-track { flex: 1; height: 6px; background: #222; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.5s; }

        /* Terminal */
        .terminal {
            background: #000; border: 1px solid var(--border); padding: 12px;
            height: 150px; overflow: hidden; font-size: 11px; color: #888;
            display: flex; flex-direction: column; justify-content: flex-end;
        }
        .log-line { margin-top: 2px; }
        .log-line.success { color: var(--primary); }
        .log-line.warn { color: #f59e0b; }
        .log-line.error { color: var(--danger); }

        /* Toggles */
        .control-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; background: #111; margin-bottom: 8px; border: 1px solid #222;
        }
        .switch {
            width: 36px; height: 20px; background: #333; border-radius: 10px; position: relative; cursor: pointer;
        }
        .switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
            background: #fff; border-radius: 50%; transition: transform 0.2s;
        }
        .switch.active { background: var(--primary); }
        .switch.active::after { transform: translateX(16px); }

        /* Dock */
        .dock {
            padding: 12px; border-top: 1px solid var(--border); background: #000;
            display: flex; justify-content: center; gap: 20px;
        }
        .dock-btn {
            background: transparent; border: 1px solid transparent; color: #666;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; transition: all 0.2s;
        }
        .dock-btn.active { color: var(--primary); border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 255, 157, 0.2); }

        .view-section { display: none; }
        .view-section.active { display: block; }

    </style>
</head>
<body>

    <div class="header">
        <div class="brand">FIA<span>OS</span>_SYS</div>
        <div class="status" id="connStatus">INIT</div>
    </div>

    <div class="content">
        
        <!-- DASHBOARD -->
        <div id="view-dash" class="view-section active">
            <div class="grid">
                <div class="card">
                    <div class="label">CPU LOAD</div>
                    <div class="value" id="cpuVal">12%</div>
                    <div class="bar-track" style="margin-top:8px"><div class="bar-fill" id="cpuBar" style="width:12%"></div></div>
                </div>
                <div class="card">
                    <div class="label">MEMORY</div>
                    <div class="value" id="ramVal">4GB</div>
                    <div class="bar-track" style="margin-top:8px"><div class="bar-fill" id="ramBar" style="width:40%; background:var(--accent)"></div></div>
                </div>
            </div>

            <div class="card" style="margin-top:10px; border-color: var(--border);">
                <div class="label">SYSTEM LOCKDOWN</div>
                <div class="control-row">
                    <span style="font-size:12px">MAINTENANCE MODE</span>
                    <div class="switch" id="maintToggle" onclick="toggleMaintenance()"></div>
                </div>
            </div>

            <div class="card" style="margin-top:10px;">
                <div class="label">KERNEL LOG</div>
                <div class="terminal" id="terminalLog">
                    <div class="log-line">> Boot sequence initiated...</div>
                    <div class="log-line success">> Core services loaded.</div>
                </div>
            </div>
        </div>

        <!-- APPS -->
        <div id="view-apps" class="view-section">
            <div class="label">APP CONTROLLER</div>
            <div id="appsList"></div>
        </div>

        <!-- USERS -->
        <div id="view-users" class="view-section">
            <div class="label">USER DATABASE</div>
            <div id="usersList"></div>
        </div>

    </div>

    <div class="dock">
        <button class="dock-btn active" onclick="switchView('dash', this)">⚡</button>
        <button class="dock-btn" onclick="switchView('apps', this)">❖</button>
        <button class="dock-btn" onclick="switchView('users', this)">👥</button>
    </div>

    <script src="admin.js"></script>
</body>
</html>
