
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Center</title>
    <style>
        :root {
            --bg-dark: #000;
            --bg-card: #1c1c1e;
            --primary: #818cf8;
            --danger: #ef4444;
            --success: #22c55e;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        .topbar {
            padding: 16px 20px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(28, 28, 30, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); z-index: 50;
        }
        .title { font-size: 17px; font-weight: 600; text-align: center; }
        .badge { background: #4f46e5; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: 700; text-transform: uppercase; }

        .tabs-container { padding: 12px 16px; background: rgba(28, 28, 30, 0.5); }
        .segmented-control {
            background: rgba(118, 118, 128, 0.24); border-radius: 9px; padding: 2px;
            display: flex; position: relative;
        }
        .segment-btn { flex: 1; padding: 6px 0; text-align: center; font-size: 13px; font-weight: 500; color: #fff; z-index: 2; cursor: pointer; }
        .segment-indicator {
            position: absolute; top: 2px; bottom: 2px; width: 25%; background: #636366;
            border-radius: 7px; box-shadow: 0 3px 8px rgba(0,0,0,0.12); transition: transform 0.3s ease; z-index: 1;
        }

        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px; }
        .hidden { display: none; }

        .card-group { background: var(--bg-card); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
        .group-title { font-size: 13px; text-transform: uppercase; color: var(--text-dim); margin: 0 0 8px 12px; letter-spacing: 0.5px; }

        .list-item {
            display: flex; align-items: center; justify-content: space-between; padding: 16px;
            background: var(--bg-card); border-bottom: 1px solid var(--border); font-size: 15px;
        }
        .list-item:last-child { border-bottom: none; }
        
        .toggle {
            width: 50px; height: 30px; background: #333; border-radius: 15px; position: relative; transition: 0.3s; cursor: pointer;
        }
        .toggle::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px;
            background: #fff; border-radius: 50%; transition: 0.3s;
        }
        .toggle.active { background: #34c759; }
        .toggle.active::after { transform: translateX(20px); }

        button.btn { background: #007aff; color: white; border: none; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
        button.btn.danger { background: var(--danger); }
        button.btn.full { width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; }

        /* JSON Editor */
        .json-editor {
            width: 100%; height: 300px; background: #111; color: #0f0; 
            font-family: monospace; border: 1px solid var(--border); border-radius: 8px; padding: 10px;
            margin-top: 10px; resize: vertical;
        }
        select { background: #2c2c2e; color: white; border: none; padding: 12px; border-radius: 12px; width: 100%; font-size: 16px; margin-top: 8px; }
        
        .loading-overlay { 
            position: absolute; inset:0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="topbar">
        <div class="title">Admin Center <span class="badge">V2</span></div>
    </div>

    <div class="tabs-container">
        <div class="segmented-control">
            <div class="segment-indicator" id="segIndicator"></div>
            <div class="segment-btn" onclick="switchTab('users', 0)">Users</div>
            <div class="segment-btn" onclick="switchTab('apps', 1)">Apps</div>
            <div class="segment-btn" onclick="switchTab('data', 2)">Cloud Data</div>
            <div class="segment-btn" onclick="switchTab('system', 3)">System</div>
        </div>
    </div>

    <div class="content">
        
        <!-- USERS TAB -->
        <div id="tab-users">
            <div class="group-title">User Management</div>
            <div class="card-group" id="usersList"></div>
        </div>

        <!-- APPS TAB -->
        <div id="tab-apps" class="hidden">
            <div class="group-title">App Visibility</div>
            <div class="card-group" id="appsList"></div>
        </div>

        <!-- DATA INSPECTOR TAB -->
        <div id="tab-data" class="hidden">
            <div class="group-title">Cloud Inspector</div>
            <div class="card-group" style="padding: 16px; position: relative;">
                <label style="color:#aaa; font-size:12px; text-transform:uppercase;">User / Target</label>
                <select id="inspUser">
                    <option value="fia">Fia</option>
                    <option value="collin">Collin</option>
                    <option value="guest">Guest (Local Only)</option>
                </select>

                <label style="color:#aaa; font-size:12px; text-transform:uppercase; margin-top:16px; display:block;">Data Type</label>
                <select id="inspType">
                    <option value="profile">User Profile</option>
                    <option value="rewards">Rewards & Valentine</option>
                    <option value="prefs">Settings & Themes</option>
                    <option value="luna">Luna State (Shared)</option>
                    <option value="adminConfig">Admin Config</option>
                </select>

                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn full" style="background:#333;" onclick="fetchInspectorData()">Fetch JSON</button>
                    <button class="btn full" onclick="saveInspectorData()">Save Changes</button>
                </div>

                <textarea id="jsonEditor" class="json-editor" spellcheck="false">// Select data and click Fetch...</textarea>
                
                <div id="inspLoading" class="loading-overlay hidden"><div class="spinner"></div></div>
            </div>
        </div>

        <!-- SYSTEM TAB -->
        <div id="tab-system" class="hidden">
            <div class="group-title">System Control</div>
            <div class="card-group">
                <div class="list-item">
                    <span>Maintenance Mode</span>
                    <div class="toggle" id="toggleMaint" onclick="toggleMaintenance()"></div>
                </div>
            </div>
            <div class="group-title">Actions</div>
            <div class="card-group">
                <div class="list-item"><button class="btn danger full" onclick="confirmAction('globalLogout')">Force Global Logout</button></div>
            </div>
        </div>

    </div>

    <script src="admin.js"></script>
</body>
</html>
