
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #040408;
            --bg-card: rgba(24, 24, 32, 0.7);
            --bg-card-hover: rgba(40, 40, 58, 0.9);
            --primary: #7c3aed;
            --primary-soft: rgba(124, 58, 237, 0.18);
            --danger: #f87171;
            --success: #34d399;
            --warning: #fbbf24;
            --text: #f8fafc;
            --text-sec: rgba(226, 232, 240, 0.65);
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(15, 15, 25, 0.65);
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top left, #1f1147 0%, #090112 55%, #050007 100%);
            color: var(--text);
            height: 100vh;
            display: flex; flex-direction: column;
            user-select: none;
        }

        /* CRT Scanline Effect */
        body::after {
            content: " ";
            display: block; position: absolute; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .header {
            padding: 16px 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 10, 18, 0.6); backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }
        .header h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
        .header span { display: block; font-size: 12px; color: var(--text-sec); font-weight: 500; margin-top: 2px; }
        .cloud-status { 
            font-size: 11px; font-weight: 600; text-transform: uppercase; 
            display: flex; align-items: center; gap: 6px; 
            background: rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 999px;
        }
        .brand { font-weight: 700; letter-spacing: -1px; display: flex; align-items: center; gap: 8px; color: var(--text); }
        .brand span { color: var(--primary); }
        .status { font-size: 10px; background: rgba(0, 255, 157, 0.1); color: var(--primary); padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        .status.offline { color: var(--danger); background: rgba(255, 0, 85, 0.1); }

        .content {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 24px;
        }

        /* Widgets */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card {
            background: var(--glass); border-radius: 20px; padding: 20px;
            border: 1px solid var(--border); margin-bottom: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 30px rgba(4, 4, 12, 0.4);
        }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
        .stat-card {
            background: var(--glass); border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; justify-content: space-between;
            border: 1px solid var(--border); min-height: 120px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
        }
        .stat-icon { font-size: 24px; margin-bottom: 10px; }
        .stat-val { font-size: 28px; font-weight: 700; line-height: 1.1; }
        .stat-label { font-size: 13px; color: var(--text-sec); margin-top: 4px; }
        .stat-sub { font-size: 11px; color: rgba(226, 232, 240, 0.45); margin-top: 6px; }

        /* Maintenance Toggle Special */
        .maint-card {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(15, 15, 25, 0.9));
            border-radius: 20px; padding: 20px; border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.12);
        }
        .maint-info h3 { margin: 0 0 4px 0; font-size: 17px; }
        .maint-info p { margin: 0; font-size: 13px; color: var(--text-sec); }

        /* App Grid */
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .app-toggle {
            background: var(--glass); border-radius: 16px; padding: 16px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            border: 2px solid transparent; cursor: pointer; transition: all 0.2s;
        }
        .app-toggle.active { background: var(--primary-soft); border-color: var(--primary); }
        .app-toggle.disabled { opacity: 0.5; filter: grayscale(1); }
        .app-icon { font-size: 32px; }
        .app-name { font-size: 12px; font-weight: 600; text-align: center; }

        /* Users List */
        .user-row {
            display: flex; align-items: center; gap: 16px; padding: 16px;
            background: var(--glass); border-radius: 16px; margin-bottom: 12px;
            cursor: pointer; border: 1px solid var(--border);
            transition: background 0.2s;
        }
        .user-row:active { background: var(--bg-card-hover); }
        .user-avatar { 
            width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #333, #555);
            display: flex; justify-content: center; align-items: center; font-size: 20px;
        }
        .user-info { flex: 1; }
        .user-name { font-size: 17px; font-weight: 600; }
        .user-role { font-size: 13px; color: var(--text-sec); text-transform: uppercase; }
        .user-arrow { color: var(--text-sec); }

        /* Rewards Search & List */
        .search-bar {
            width: 100%; background: rgba(15, 15, 25, 0.7); border: 1px solid var(--border);
            padding: 12px 16px; border-radius: 12px; color: #fff; font-size: 16px;
            margin-bottom: 20px; outline: none; transition: border-color 0.2s;
        }
        .search-bar:focus { border-color: var(--primary); }

        .reward-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; background: var(--glass); border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .reward-item:first-child { border-top-left-radius: 16px; border-top-right-radius: 16px; }
        .reward-item:last-child { border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; border-bottom: none; }
        
        .label { font-size: 10px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; letter-spacing: 1px; }
        .value { font-size: 24px; font-weight: 700; color: #fff; }
        
        /* Navigation (Dock) */
        .admin-dock {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(12, 12, 20, 0.9); backdrop-filter: blur(24px);
            border: 1px solid var(--border); border-radius: 30px;
            padding: 6px; display: flex; gap: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .dock-btn {
            width: 50px; height: 50px; border-radius: 24px; border: none;
            background: transparent; color: var(--text-sec);
            font-size: 24px; cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .switch {
            width: 36px; height: 20px; background: #333; border-radius: 10px; position: relative; cursor: pointer;
        }
        .switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
            background: #fff; border-radius: 50%; transition: transform 0.2s;
        }
        .switch.active { background: var(--primary); }
        .switch.active::after { transform: translateX(16px); }

        /* Dock */
        .dock {
            padding: 12px; border-top: 1px solid var(--border); background: #000;
            display: flex; justify-content: center; gap: 20px;
        }
        .dock-btn {
            background: transparent; border: 1px solid transparent; color: #666;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; transition: all 0.2s;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .close-btn { background: rgba(255,255,255,0.1); border: none; width: 32px; height: 32px; border-radius: 50%; color: #fff; cursor: pointer; }

        .btn-danger { width: 100%; padding: 14px; background: rgba(248, 113, 113, 0.15); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.35); border-radius: 12px; font-weight: 700; margin-top: 12px; cursor: pointer; }
        .btn-action { width: 100%; padding: 14px; background: rgba(124, 58, 237, 0.2); color: #fff; border: 1px solid rgba(124, 58, 237, 0.4); border-radius: 12px; font-weight: 600; margin-top: 8px; cursor: pointer; }
        .btn-action.primary { background: var(--primary); color: #fff; border: none; }

        .input-row { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(15, 15, 25, 0.7); border-radius: 12px; margin-bottom: 10px; }
        .input-row input { background: transparent; border: none; color: #fff; flex: 1; text-align: right; font-size: 16px; font-weight: 600; outline: none; }

        .view-section { display: none; }
        .view-section.active { display: block; }

    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>Control Center</h1>
            <span>Admin Übersicht & Live-Steuerung</span>
        </div>
        <div class="cloud-status">
            <div class="dot" id="cloudDot"></div>
            <span id="cloudText">Checking...</span>
        </div>
    </div>

    <div class="content">
        
        <!-- DASHBOARD -->
        <div id="view-dash" class="view-section active">
            <div class="maint-card">
                <div class="maint-info">
                    <h3>Wartungsmodus</h3>
                    <p>Loggt alle Geräte aus & zeigt den Wartungsscreen</p>
                </div>
                <div class="toggle" id="maintToggle" onclick="toggleMaintenance()"></div>
            </div>

            <!-- Luna Control -->
            <div class="section-label">Luna 3D Manager 🐑</div>
            <div class="card">
                <div class="slider-group">
                    <div class="slider-label"><span>Hunger</span><span id="lunaHungerVal">50</span></div>
                    <input type="range" class="slider-input" id="lunaHunger" min="0" max="100" onchange="updateLunaStat()">
                </div>
                <div class="card">
                    <div class="label">MEMORY</div>
                    <div class="value" id="ramVal">4GB</div>
                    <div class="bar-track" style="margin-top:8px"><div class="bar-fill" id="ramBar" style="width:40%; background:var(--accent)"></div></div>
                </div>
            </div>

            <div class="card" style="margin-top:10px; border-color: var(--border);">
                <div class="label">SYSTEM LOCKDOWN</div>
                <div class="control-row">
                    <span style="font-size:12px">MAINTENANCE MODE</span>
                    <div class="switch" id="maintToggle" onclick="toggleMaintenance()"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🛠️</div>
                    <div class="stat-val" id="statUpdated">—</div>
                    <div class="stat-label">Letzte Änderung</div>
                    <div class="stat-sub" id="statEditedBy">—</div>
                </div>
            </div>

            <div class="section-label">Quick Actions</div>
            <div class="card">
                <button class="btn-action primary" onclick="forceSync()">Force Cloud Sync ☁️</button>
            </div>
        </div>

        <!-- APPS -->
        <div id="view-apps" class="view-section">
            <div class="label">APP CONTROLLER</div>
            <div id="appsList"></div>
        </div>

        <!-- USERS -->
        <div id="view-users" class="view-section">
            <div class="label">USER DATABASE</div>
            <div id="usersList"></div>
        </div>

    </div>

    <div class="dock">
        <button class="dock-btn active" onclick="switchView('dash', this)">⚡</button>
        <button class="dock-btn" onclick="switchView('apps', this)">❖</button>
        <button class="dock-btn" onclick="switchView('users', this)">👥</button>
    </div>

    <script src="admin.js"></script>
</body>
</html>
