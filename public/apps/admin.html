
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdminOS</title>
    <style>
        :root {
            --bg-dark: #000000;
            --bg-card: #1c1c1e;
            --bg-hover: #2c2c2e;
            --primary: #0a84ff;
            --danger: #ff453a;
            --success: #32d74b;
            --text: #ffffff;
            --text-sec: rgba(235, 235, 245, 0.6);
            --border: rgba(84, 84, 88, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* --- Sidebar / Nav (Mobile: Top, Desktop: Left potentially, but sticking to mobile-first top for iframe) --- */
        .nav-bar {
            padding: 12px;
            background: rgba(28, 28, 30, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .segmented-control {
            background: rgba(118, 118, 128, 0.24);
            border-radius: 9px;
            padding: 2px;
            display: flex;
            position: relative;
            height: 32px;
        }
        
        .segment-btn {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 500;
            color: #fff;
            z-index: 2;
            cursor: pointer;
            border-radius: 7px;
            transition: color 0.2s;
        }
        .segment-btn.active { color: #fff; font-weight: 600; }
        
        .segment-indicator {
            position: absolute; top: 2px; bottom: 2px; width: 25%;
            background: #636366; border-radius: 7px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 1;
        }

        /* --- Content Area --- */
        .main-view {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px;
        }
        
        .section-title {
            font-size: 13px; color: var(--text-sec);
            text-transform: uppercase; margin: 24px 0 8px 16px;
            letter-spacing: 0.5px;
        }
        .section-title:first-child { margin-top: 0; }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        /* --- List Items --- */
        .list-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            min-height: 48px;
        }
        .list-row:last-child { border-bottom: none; }
        
        .row-left { display: flex; flex-direction: column; gap: 2px; }
        .row-main { font-size: 17px; }
        .row-sub { font-size: 13px; color: var(--text-sec); }

        /* --- App Grid --- */
        .app-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px; padding: 0 4px;
        }
        .app-card {
            background: var(--bg-card);
            padding: 16px; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .app-card.disabled { opacity: 0.5; filter: grayscale(1); }
        .app-card.active { border-color: var(--primary); background: rgba(10, 132, 255, 0.1); }
        
        .app-icon { font-size: 32px; }
        .app-name { font-size: 15px; font-weight: 600; }
        .app-status { font-size: 11px; color: var(--text-sec); }

        /* --- User Cards --- */
        .user-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px; background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%; background: #333;
            display: flex; align-items: center; justify-content: center; font-size: 18px; margin-right: 12px;
        }
        .user-info { flex: 1; }
        .user-role-badge { 
            font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #333; color: #aaa; text-transform: uppercase; margin-left: 6px; 
        }
        .banned .user-role-badge { background: var(--danger); color: white; }

        /* --- JSON Editor --- */
        .editor-container {
            display: flex; flex-direction: column; height: 100%;
        }
        .editor-toolbar {
            display: flex; gap: 10px; margin-bottom: 10px;
        }
        select, .btn-small {
            background: var(--bg-hover); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 13px;
        }
        .btn-small { cursor: pointer; font-weight: 600; }
        .btn-small.primary { background: var(--primary); }
        
        .json-area {
            width: 100%; height: 400px;
            background: #111; color: #0f0;
            font-family: 'Menlo', 'Monaco', monospace; font-size: 12px;
            padding: 16px; border-radius: 12px; border: 1px solid var(--border);
            resize: vertical; outline: none;
        }
        .json-area.error { border-color: var(--danger); }

        /* --- Toggles & Buttons --- */
        .toggle {
            width: 51px; height: 31px; background: #39393d; border-radius: 15.5px;
            position: relative; transition: 0.3s; cursor: pointer;
        }
        .toggle::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 27px; height: 27px; background: #fff; border-radius: 50%;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15); transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .toggle.active { background: var(--success); }
        .toggle.active::after { transform: translateX(20px); }

        .btn-block {
            width: 100%; padding: 14px; background: var(--bg-card); color: var(--primary);
            font-size: 17px; font-weight: 500; border: none; border-radius: 12px; cursor: pointer;
            margin-bottom: 16px;
        }
        .btn-block.danger { color: var(--danger); }
        .btn-block:active { background: var(--bg-hover); opacity: 0.8; }

        .loading-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 50;
            display: flex; align-items: center; justify-content: center;
        }
        .spinner {
            width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s infinite linear;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; display: inline-block; margin-right: 6px; }
        .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }

    </style>
</head>
<body>

    <div class="nav-bar">
        <div class="segmented-control">
            <div class="segment-indicator" id="segIndicator"></div>
            <div class="segment-btn active" onclick="switchTab('dashboard', 0)">Dash</div>
            <div class="segment-btn" onclick="switchTab('users', 1)">Users</div>
            <div class="segment-btn" onclick="switchTab('apps', 2)">Apps</div>
            <div class="segment-btn" onclick="switchTab('cloud', 3)">Cloud</div>
        </div>
    </div>

    <div class="main-view">
        
        <!-- DASHBOARD TAB -->
        <div id="tab-dashboard">
            <div class="section-title">System Status</div>
            <div class="card">
                <div class="list-row">
                    <div class="row-left">
                        <span class="row-main">Maintenance Mode</span>
                        <span class="row-sub">Sperrt Zugriff für User</span>
                    </div>
                    <div class="toggle" id="dashMaintToggle" onclick="toggleMaintenance()"></div>
                </div>
                <div class="list-row">
                    <div class="row-left">
                        <span class="row-main">Cloud Connection</span>
                        <span class="row-sub" id="cloudStatusTxt">Checking...</span>
                    </div>
                    <div class="status-dot" id="cloudStatusDot"></div>
                </div>
            </div>

            <div class="section-title">Schnellzugriff</div>
            <div class="app-grid" style="grid-template-columns: 1fr 1fr;">
                <button class="btn-block" onclick="quickAction('healLuna')" style="background: #1c1c1e; color: #ec4899; margin:0;">
                    💖 Luna Heilen
                </button>
                <button class="btn-block" onclick="quickAction('resetDaily')" style="background: #1c1c1e; color: #fbbf24; margin:0;">
                    ☀️ Reset Daily
                </button>
            </div>
            
            <button class="btn-block danger" style="margin-top:24px;" onclick="confirmAction('globalLogout')">
                Alle User ausloggen
            </button>
        </div>

        <!-- USERS TAB -->
        <div id="tab-users" class="hidden">
            <div class="section-title">Benutzerverwaltung</div>
            <div class="card" id="userListContainer">
                <!-- Populated by JS -->
                <div style="padding:20px; text-align:center;">Lade User...</div>
            </div>
        </div>

        <!-- APPS TAB -->
        <div id="tab-apps" class="hidden">
            <div class="section-title">App Sichtbarkeit</div>
            <div class="app-grid" id="appsGrid">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- CLOUD TAB -->
        <div id="tab-cloud" class="hidden">
            <div class="section-title">Datenbank Inspektor</div>
            <div class="editor-toolbar">
                <select id="inspTarget" style="flex:1;">
                    <option value="fia">👤 Fia</option>
                    <option value="collin">👤 Collin</option>
                    <option value="guest">👤 Gast (Lokal)</option>
                </select>
                <select id="inspType" style="flex:1;">
                    <option value="profile">Profil</option>
                    <option value="rewards">Rewards</option>
                    <option value="prefs">Settings</option>
                    <option value="luna">Luna (Shared)</option>
                    <option value="adminConfig">Config</option>
                </select>
                <button class="btn-small primary" onclick="fetchData()">Laden</button>
            </div>

            <textarea id="jsonEditor" class="json-area" spellcheck="false" placeholder="// Wähle Daten und klicke Laden..."></textarea>
            
            <div style="display:flex; justify-content:space-between; margin-top:10px;">
                <span id="editorStatus" style="font-size:11px; color:var(--text-sec); align-self:center;">Bereit</span>
                <button class="btn-small primary" onclick="saveData()">Speichern</button>
            </div>
        </div>

    </div>

    <!-- Feedback Overlay -->
    <div id="loading" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
