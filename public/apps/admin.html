
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdminOS</title>
    <style>
        :root {
            --bg-dark: #000000;
            --bg-card: #1c1c1e;
            --bg-hover: #2c2c2e;
            --primary: #0a84ff;
            --danger: #ff453a;
            --success: #32d74b;
            --text: #ffffff;
            --text-sec: rgba(235, 235, 245, 0.6);
            --border: rgba(84, 84, 88, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* --- Nav --- */
        .nav-bar {
            padding: 12px;
            background: rgba(28, 28, 30, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .segmented-control {
            background: rgba(118, 118, 128, 0.24);
            border-radius: 9px;
            padding: 2px;
            display: flex;
            position: relative;
            height: 32px;
        }
        
        .segment-btn {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 500;
            color: #fff;
            z-index: 2;
            cursor: pointer;
            border-radius: 7px;
            transition: color 0.2s;
        }
        .segment-btn.active { color: #fff; font-weight: 600; }
        
        .segment-indicator {
            position: absolute; top: 2px; bottom: 2px; width: 25%;
            background: #636366; border-radius: 7px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 1;
        }

        /* --- Content Area --- */
        .main-view {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px;
        }
        
        .section-title {
            font-size: 13px; color: var(--text-sec);
            text-transform: uppercase; margin: 24px 0 8px 16px;
            letter-spacing: 0.5px;
        }
        .section-title:first-child { margin-top: 0; }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        /* --- List Items --- */
        .list-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            min-height: 48px;
        }
        .list-row:last-child { border-bottom: none; }
        
        .row-left { display: flex; flex-direction: column; gap: 2px; }
        .row-main { font-size: 17px; }
        .row-sub { font-size: 13px; color: var(--text-sec); }

        /* --- App Grid --- */
        .app-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px; padding: 0 4px;
        }
        .app-card {
            background: var(--bg-card);
            padding: 16px; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .app-card.disabled { opacity: 0.5; filter: grayscale(1); }
        .app-card.active { border-color: var(--primary); background: rgba(10, 132, 255, 0.1); }
        
        .app-icon { font-size: 32px; }
        .app-name { font-size: 15px; font-weight: 600; }
        .app-status { font-size: 11px; color: var(--text-sec); }

        /* --- User Management --- */
        .user-header {
            display: flex; align-items: center; gap: 16px; padding: 20px;
            background: linear-gradient(to right, #1c1c1e, #2c2c2e);
            border-radius: 16px; margin-bottom: 20px;
        }
        .user-big-avatar { width: 60px; height: 60px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .user-actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        
        .action-card {
            background: var(--bg-card); padding: 16px; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
            cursor: pointer; transition: background 0.2s;
        }
        .action-card:active { background: var(--bg-hover); }
        .action-card.danger { color: var(--danger); }
        
        /* --- Rewards List --- */
        .reward-toggle-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: var(--bg-card); border-bottom: 1px solid var(--border);
        }
        .reward-info { display: flex; align-items: center; gap: 10px; }
        .reward-icon { width: 32px; height: 32px; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; justify-content: center; align-items: center; }

        /* --- Toggles & Buttons --- */
        .toggle {
            width: 51px; height: 31px; background: #39393d; border-radius: 15.5px;
            position: relative; transition: 0.3s; cursor: pointer; flex-shrink: 0;
        }
        .toggle::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 27px; height: 27px; background: #fff; border-radius: 50%;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15); transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .toggle.active { background: var(--success); }
        .toggle.active::after { transform: translateX(20px); }

        .btn-block {
            width: 100%; padding: 14px; background: var(--bg-card); color: var(--primary);
            font-size: 17px; font-weight: 500; border: none; border-radius: 12px; cursor: pointer;
            margin-bottom: 16px;
        }
        .btn-block:active { background: var(--bg-hover); opacity: 0.8; }

        .loading-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 50;
            display: flex; align-items: center; justify-content: center;
        }
        .spinner {
            width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s infinite linear;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; display: inline-block; margin-right: 6px; }
        .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }

    </style>
</head>
<body>

    <div class="nav-bar">
        <div class="segmented-control">
            <div class="segment-indicator" id="segIndicator"></div>
            <div class="segment-btn active" onclick="switchTab('system', 0)">System</div>
            <div class="segment-btn" onclick="switchTab('fia', 1)">Fia</div>
            <div class="segment-btn" onclick="switchTab('collin', 2)">Collin</div>
            <div class="segment-btn" onclick="switchTab('rewards', 3)">Rewards</div>
        </div>
    </div>

    <div class="main-view">
        
        <!-- SYSTEM TAB -->
        <div id="tab-system">
            <div class="section-title">System Status</div>
            <div class="card">
                <div class="list-row">
                    <div class="row-left">
                        <span class="row-main">Maintenance Mode</span>
                        <span class="row-sub">Sperrt Zugriff für User (Password Bypass)</span>
                    </div>
                    <div class="toggle" id="dashMaintToggle" onclick="toggleMaintenance()"></div>
                </div>
                <div class="list-row">
                    <div class="row-left">
                        <span class="row-main">Cloud Connection</span>
                        <span class="row-sub" id="cloudStatusTxt">Checking...</span>
                    </div>
                    <div class="status-dot" id="cloudStatusDot"></div>
                </div>
            </div>

            <div class="section-title">App Sichtbarkeit</div>
            <div class="app-grid" id="appsGrid">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- USER TABS (Template populated by JS) -->
        <div id="tab-user-detail" class="hidden">
            <div class="user-header">
                <div class="user-big-avatar" id="uDetailAvatar">👤</div>
                <div>
                    <h2 style="font-size:24px; font-weight:700;" id="uDetailName">User</h2>
                    <p style="color:var(--text-sec); font-size:13px;" id="uDetailId">ID: ...</p>
                </div>
            </div>

            <div class="section-title">Aktionen</div>
            <div class="user-actions-grid">
                <div class="action-card" onclick="actionResetOnboarding()">
                    <span style="font-size:24px;">🚀</span>
                    <span style="font-weight:600; font-size:13px;">Reset Intro</span>
                </div>
                <div class="action-card" onclick="actionForceLogout()">
                    <span style="font-size:24px;">🔌</span>
                    <span style="font-weight:600; font-size:13px;">Force Logout</span>
                </div>
            </div>

            <div class="section-title">Status</div>
            <div class="card">
                <div class="list-row">
                    <div class="row-left">
                        <span class="row-main">Account Ban</span>
                        <span class="row-sub">Sperrt Login komplett</span>
                    </div>
                    <div class="toggle" id="uDetailBanToggle" onclick="actionToggleBan()"></div>
                </div>
            </div>
        </div>

        <!-- REWARDS TAB -->
        <div id="tab-rewards" class="hidden">
            <div style="padding: 0 16px 16px;">
                <select id="rewardUserSelect" onchange="loadUserRewardsList()" style="width:100%; padding:10px; border-radius:12px; background:var(--bg-card); color:white; border:none; font-size:16px;">
                    <option value="fia">Fia</option>
                    <option value="collin">Collin</option>
                    <option value="guest">Gast</option>
                </select>
            </div>
            
            <div class="card" id="rewardsListContainer">
                <!-- List -->
            </div>
        </div>

    </div>

    <!-- Feedback Overlay -->
    <div id="loading" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
